name = "LeanCondensedMatter"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanCondensedMatter"]
# Run the Batteries linter over the curated public library target. Individual `nolint` annotations
# are reserved for proof witnesses or compatibility parameters intentionally retained in public APIs.
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Keep warning-as-error focused on correctness, API health, and deprecations rather than formatting.
linter.style.header = false
linter.style.longLine = false
linter.unnecessarySimpa = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "LeanCondensedMatter"
