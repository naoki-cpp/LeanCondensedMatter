name = "LeanCondensedMatter"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanCondensedMatter"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# The project intentionally uses concise local headers and allows long mathematical signatures.
linter.style.header = false
linter.style.longLine = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "LeanCondensedMatter"
