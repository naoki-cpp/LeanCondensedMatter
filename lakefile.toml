name = "LeanCondensedMatter"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanCondensedMatter"]
# Mathlib 4.35 uses the module system; keep this project's existing non-module
# source files until a separate, deliberate module-system migration.
allowNonModules = true
# Run the Batteries linter over the curated public library target. Remaining `nolint` annotations
# record intentional proof witnesses, compatibility parameters, or high-level simp APIs.
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Keep warning-as-error focused on correctness, API health, and deprecations rather than formatting.
linter.style.header = false
linter.style.longLine = false
linter.style.haveILetI = false
linter.unnecessarySimpa = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "LeanCondensedMatter"
