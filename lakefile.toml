name = "LeanCondensedMatter"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanCondensedMatter"]
# Run the Batteries linter over the curated public library target. Remaining `nolint` annotations
# record intentional proof witnesses, compatibility parameters, or high-level simp APIs.
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Keep warning-as-error focused on correctness, API health, and deprecations rather than formatting.
linter.style.header = false
linter.style.longLine = false
linter.style.haveILetI = false
linter.unnecessarySimpa = false
# Lean 4.33 tightened backward type-level definitional equality. Keep the previous behavior during
# the version migration; remove this once the affected proofs have explicit coercion/API bridges.
backward.isDefEq.respectTransparency.types = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "LeanCondensedMatter"
