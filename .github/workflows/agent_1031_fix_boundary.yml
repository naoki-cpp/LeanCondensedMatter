name: Agent 1031 Boundary Fix

on:
  push:
    branches:
      - agent/1031-fermionic-lattice

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove lattice downstream dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lattice = Path('LeanCondensedMatter/SecondQuantization/Fermionic/Lattice')
          field = Path('LeanCondensedMatter/SecondQuantization/Fermionic/Field')

          # Discrete lattice only used one tiny generic commutator helper from Field.ChargeDensity.
          # Keep that proof-only fact private here instead of creating an upward dependency.
          p = lattice / 'DiscreteLattice.lean'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'import LeanCondensedMatter.SecondQuantization.Fermionic.Field.ChargeDensity\n',
              'import LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.SecondQuantizationCommutator\n')
          anchor = 'variable {Site : Type*}\n\n'
          helper = '''private theorem linearCommutator_smul_right\n    {V : Type*} [AddCommGroup V] [Module ℂ V]\n    (q : ℂ) (A B : V →ₗ[ℂ] V) :\n    AlgebraicFock.linearCommutator A (q • B) =\n      q • AlgebraicFock.linearCommutator A B := by\n  apply LinearMap.ext\n  intro Ψ\n  simp [AlgebraicFock.linearCommutator, smul_sub]\n\n'''
          if helper not in text:
              text = text.replace(anchor, anchor + helper)
          p.write_text(text, encoding='utf-8')

          # HermitianBondCurrent contains one response theorem; split it downstream.
          p = lattice / 'HermitianBondCurrent.lean'
          text = p.read_text(encoding='utf-8')
          marker = '/-- Peierls current response for Hermitian hopping and real charge'
          i = text.index(marker)
          j = text.rindex('\nend\nend Lattice')
          model = text[:i]
          model = model.replace(
              'The final theorem specializes the Peierls current-response result without requiring a separate\nself-adjointness hypothesis from the caller.\n',
              'Response theorems consuming these self-adjoint currents live downstream in `Fermionic.Field`.\n')
          model += 'end\nend Lattice\nend Fermionic\nend SecondQuantization\n'
          p.write_text(model, encoding='utf-8')

          response_body = text[i:j]
          response = '''import LeanCondensedMatter.SecondQuantization.Fermionic.Lattice.HermitianBondCurrent\nimport LeanCondensedMatter.SecondQuantization.Fermionic.Field.PeierlsContactResponse\n\nset_option linter.style.header false\n\n/-!\n# Hermitian bond-current response adapter\n\nSelf-adjointness is derived in `Fermionic.Lattice.HermitianBondCurrent`; this downstream module\nuses it to specialize the generic Peierls current response theorem.\n-/\n\nnamespace SecondQuantization\nnamespace Fermionic\nnamespace Field\n\nopen Lattice\n\nnoncomputable section\n\nvariable {Site : Type*} [LinearOrder Site] [Fintype Site]\n\n''' + response_body + '''\nend\nend Field\nend Fermionic\nend SecondQuantization\n'''
          (field / 'HermitianBondCurrentResponse.lean').write_text(response, encoding='utf-8')

          # Ensure response umbrella exposes the new downstream theorem, while the lattice umbrella
          # remains model-only.
          fumbrella = Path('LeanCondensedMatter/SecondQuantization/Fermionic/Field.lean')
          text = fumbrella.read_text(encoding='utf-8')
          needle = 'import LeanCondensedMatter.SecondQuantization.Fermionic.Field.PeierlsContactResponse\n'
          addition = 'import LeanCondensedMatter.SecondQuantization.Fermionic.Field.HermitianBondCurrentResponse\n'
          if addition not in text:
              text = text.replace(needle, needle + addition)
          fumbrella.write_text(text, encoding='utf-8')

          Path('.github/workflows/agent_1031_fix_boundary.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(fermionic-lattice): isolate response adapters"
          git push
