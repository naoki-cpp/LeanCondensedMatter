name: Apply bosonic two-point constraint fix

on:
  push:
    branches:
      - agent/lint-api-cleanup-all

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/lint-api-cleanup-all
      - name: Localize decidable equality
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("LeanCondensedMatter/SecondQuantization/Bosonic/Thermal/BlochDeDominicis/TwoPoint.lean")
          text = path.read_text()
          old = """namespace SecondQuantization
          namespace Bosonic

          variable {Mode : Type*} [DecidableEq Mode] [Fintype Mode]
          """.replace("          ", "")
          new = """namespace SecondQuantization
          namespace Bosonic

          noncomputable section

          variable {Mode : Type*} [Fintype Mode]

          local instance instDecidableEqBosonicBlochDeDominicisTwoPoint : DecidableEq Mode :=
            Classical.decEq Mode
          """.replace("          ", "")
          if old not in text:
              raise RuntimeError("section header pattern not found")
          text = text.replace(old, new, 1)
          old_tail = "\nend Bosonic\nend SecondQuantization\n"
          new_tail = "\nend\nend Bosonic\nend SecondQuantization\n"
          if old_tail not in text:
              raise RuntimeError("namespace tail pattern not found")
          text = text.replace(old_tail, new_tail, 1)
          path.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LeanCondensedMatter/SecondQuantization/Bosonic/Thermal/BlochDeDominicis/TwoPoint.lean
          git commit -m "fix: localize bosonic two-point decidable equality"
          git push origin HEAD:agent/lint-api-cleanup-all
