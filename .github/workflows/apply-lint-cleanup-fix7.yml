name: Apply final typeclass cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/lint-api-cleanup-all' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply cleanup
        run: |
          python3 .github/scripts/apply_lint_cleanup_fix7.py
          rm -f .github/scripts/apply_lint_cleanup_fix7.py
          rm -f .github/workflows/apply-lint-cleanup-fix7.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: finish typeclass and unused-argument cleanup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
