name: Apply full lint cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/lint-api-cleanup-all' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply generated refactor
        run: |
          cat .github/lint-cleanup-patch/part00 \
              .github/lint-cleanup-patch/part01 \
              .github/lint-cleanup-patch/part02 \
              .github/lint-cleanup-patch/part03_04 \
              .github/lint-cleanup-patch/part05_06 \
              .github/lint-cleanup-patch/part07_08 \
            | base64 -d > /tmp/cleanup.tar.gz
          tar -xzf /tmp/cleanup.tar.gz
          rm -rf .github/lint-cleanup-patch
          rm -f .github/workflows/apply-full-lint-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: apply complete lint and API cleanup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
