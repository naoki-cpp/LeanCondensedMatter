name: Refine lint exception cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'agent/reduce-lint-exceptions'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/reduce-lint-exceptions
          fetch-depth: 0

      - name: Keep focused lint improvements
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          edits = {
              "LeanCondensedMatter/SecondQuantization/Bosonic/Algebra/FockSpace.lean": [
                  (
                      "abbrev FockSpace (Mode : Type*) := Common.AlgebraicFock (Occupation Mode)",
                      "@[nolint unusedArguments]\nabbrev FockSpace (Mode : Type*) [DecidableEq Mode] :=\n  Common.AlgebraicFock (Occupation Mode)",
                  ),
              ],
              "LeanCondensedMatter/SecondQuantization/Fermionic/Algebra/FockSpace.lean": [
                  (
                      "abbrev FockSpace (Mode : Type*) :=\n  Common.AlgebraicFock (Occupation Mode)",
                      "@[nolint unusedArguments]\nabbrev FockSpace (Mode : Type*) [DecidableEq Mode] :=\n  Common.AlgebraicFock (Occupation Mode)",
                  ),
              ],
              "LeanCondensedMatter/SecondQuantization/Fermionic/Perturbation/DysonVertexMoment.lean": [
                  (
                      "noncomputable def dysonVertexMoment {α : Type*} (ε : Mode → ℝ)",
                      "@[nolint unusedArguments]\nnoncomputable def dysonVertexMoment {α : Type*} [DecidableEq α] (ε : Mode → ℝ)",
                  ),
              ],
              "LeanCondensedMatter/QuantumTheory/LinearResponse/KuboFormula.lean": [
                  (
                      "  map_one := by\n    simpa using ρ.expectation_id",
                      "  map_one := by\n    change ρ.expectation (ContinuousLinearMap.id ℂ H) = 1\n    exact ρ.expectation_id",
                  ),
              ],
          }

          for filename, replacements in edits.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"{filename}: expected one match for {old!r}, found {count}"
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

          git add LeanCondensedMatter
          git rm .github/workflows/refine_lint_exception_cleanup.yml
          git commit -m "fix: keep lint exception cleanup focused"
          git push origin HEAD:agent/reduce-lint-exceptions
