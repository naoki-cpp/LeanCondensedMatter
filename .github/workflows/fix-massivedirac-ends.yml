name: Fix MassiveDirac namespace ends

on:
  push:
    branches:
      - refactor/1840-finalize-massive-dirac-migration

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix split historical namespace endings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("LeanCondensedMatter/Transport/Models/MassiveDirac/Disorder/Born/Denominator.lean"),
              Path("LeanCondensedMatter/Transport/Models/MassiveDirac/Disorder/FiniteBroadeningBornPropagator.lean"),
          ]
          old = "end MassiveDirac\nend AnomalousHall"
          new = "end QuantumTheory.Transport.Models.MassiveDirac"
          for path in paths:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected split ending not found in {path}")
              path.write_text(text.replace(old, new))
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LeanCondensedMatter/Transport/Models/MassiveDirac/Disorder/Born/Denominator.lean \
            LeanCondensedMatter/Transport/Models/MassiveDirac/Disorder/FiniteBroadeningBornPropagator.lean
          git commit -m "fix(transport): close migrated MassiveDirac namespaces"
          git push origin HEAD:${GITHUB_REF_NAME}
