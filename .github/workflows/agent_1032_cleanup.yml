name: Agent 1032 Cleanup

on:
  push:
    branches:
      - agent/1032-fermionic-transport-validation

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/1032-fermionic-transport-validation
      - name: Remove stale Field opens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for rel in [
              'LeanCondensedMatter/SecondQuantization/Fermionic/Transport/StredaOccupation.lean',
              'LeanCondensedMatter/SecondQuantization/Fermionic/Transport/StaticStredaWardBridge.lean',
          ]:
              p = Path(rel)
              s = p.read_text()
              s = s.replace('open SecondQuantization.Fermionic.Field\n', '')
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/workflows/agent_1032_cleanup.yml
          git commit -m 'fix(fermionic-transport): drop stale Field namespace opens'
          git push origin HEAD:agent/1032-fermionic-transport-validation
