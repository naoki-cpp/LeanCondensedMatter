name: Agent 1030 qualify downstream

on:
  push:
    branches:
      - agent/1030-fermionic-algebraic-fock

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Qualify unambiguous moved identifiers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('LeanCondensedMatter/SecondQuantization/Fermionic/Field')
          names = [
              'dGammaLinear',
              'dGamma_linearCommutator',
              'dGamma_add',
              'dGamma_smul',
              'dGamma_zero',
              'dGamma_algebraMap',
              'dGamma_oneParticle_mul',
              'dGamma_oneParticle',
              'dGamma',
              'linearCommutator',
              'occupationEquiv',
              'occupationConjugate',
          ]
          for path in root.rglob('*.lean'):
              text = path.read_text(encoding='utf-8')
              new = text
              for name in names:
                  pattern = rf'(?<![A-Za-z0-9_.]){re.escape(name)}(?![A-Za-z0-9_])'
                  new = re.sub(pattern, f'AlgebraicFock.{name}', new)
              if new != text:
                  path.write_text(new, encoding='utf-8')
          PY
      - name: Commit qualifications
        shell: bash
        run: |
          rm .github/workflows/agent_1030_qualify_downstream.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(fermionic-field): qualify algebraic Fock dependencies"
          git push
