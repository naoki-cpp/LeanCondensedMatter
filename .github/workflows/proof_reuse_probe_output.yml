name: Proof Reuse Probe Output

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto
      - name: Show exact and apply suggestion output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('LeanCondensedMatter/Analysis/Dyson/Basic.lean').read_text()
          old = '''theorem coeff_one (V : ℝ → A) (τ : ℝ) :\n    coeff V 1 τ = -∫ σ in (0 : ℝ)..τ, V σ := by\n  rw [show (1 : ℕ) = 0 + 1 by rfl, coeff_succ]\n  simp\n'''
          if old not in src:
              raise SystemExit('target proof not found')
          for name, tactic in [('ExactProbe', 'exact?'), ('ApplyProbe', 'apply?')]:
              text = src.replace(old, old.split(':= by')[0] + ':= by\n  ' + tactic + '\n', 1)
              Path(f'/tmp/{name}.lean').write_text(text)
          PY
          echo '=== exact? ==='
          lake env lean /tmp/ExactProbe.lean 2>&1 || true
          echo '=== apply? ==='
          lake env lean /tmp/ApplyProbe.lean 2>&1 || true
