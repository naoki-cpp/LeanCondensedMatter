name: Proof Reuse Replay Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  proof-reuse-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto
      - name: Build representative module
        run: lake build LeanCondensedMatter.Analysis.Dyson.Basic
      - name: Check audit Python syntax
        run: python3 -m py_compile scripts/proof_reuse_audit.py
      - name: Check known positive replacement
        shell: bash
        run: |
          set -euo pipefail
          cat > ProofReusePositive.lean <<'EOF'
          import LeanCondensedMatter.Analysis.Dyson.Basic

          open Dyson

          variable {A : Type*} [NormedRing A] [NormedAlgebra ℂ A] [CompleteSpace A]

          example (V : ℝ → A) (τ : ℝ) : coeff V 0 τ = 1 := by
            unfold coeff
            rfl
          EOF
          python3 scripts/proof_reuse_audit.py ProofReusePositive.lean \
            --max-blocks 1 \
            --max-findings 1 \
            --timeout 30 | tee proof-reuse-positive.log
          grep -F 'verified by replay: yes' proof-reuse-positive.log
          grep -F 'coeff_zero' proof-reuse-positive.log
      - name: Run replay-verified audit on real project file
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/proof_reuse_audit.py \
            LeanCondensedMatter/Analysis/Dyson/Basic.lean \
            --max-blocks 4 \
            --max-span-tactics 4 \
            --max-intervals-per-block 4 \
            --max-findings 3 \
            --timeout 30 | tee proof-reuse-replay.log
