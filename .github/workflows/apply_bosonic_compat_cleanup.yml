name: Apply Bosonic Compatibility Cleanup

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-and-build:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-bosonic-compat-aliases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/remove-bosonic-compat-aliases
          fetch-depth: 0

      - name: Apply compatibility cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/remove_bosonic_compat_aliases.py
          rm scripts/remove_bosonic_compat_aliases.py
          rm .github/workflows/apply_bosonic_compat_cleanup.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove bosonic compatibility aliases"
          git push origin HEAD:agent/remove-bosonic-compat-aliases

      - uses: leanprover/lean-action@v1

      - name: Check for sorry
        run: |
          if grep -rnE '\bsorry\b' --include='*.lean' LeanCondensedMatter; then
            echo "::error::Found sorry in Lean sources"
            exit 1
          fi
