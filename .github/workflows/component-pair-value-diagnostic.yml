name: Component Pair Value Diagnostic

on:
  push:
    branches:
      - agent/component-pair-value-compat
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - name: Build target and capture output
        shell: bash
        run: |
          set +e
          lake build +LeanCondensedMatter.SecondQuantization.Fermionic.Diagrammatics.WickDiagram.ComponentPairValue \
            > component-pair-value-diagnostic.log 2>&1
          status=$?
          echo "exit_status=$status" >> component-pair-value-diagnostic.log
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: component-pair-value-diagnostic
          path: component-pair-value-diagnostic.log
          if-no-files-found: error
          retention-days: 1
