name: Meta Audit Probe

on:
  push:
    branches: [feat/meta-audit-catalog]

permissions:
  contents: read

concurrency:
  group: meta-audit-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore project build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: meta-audit-project-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            meta-audit-project-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
          fail-on-cache-miss: true

      - name: Set up Lean and dependency cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto

      - name: Generate theorem catalog
        run: lake env lean scripts/TheoremCatalog.lean

      - name: Validate theorem catalog schema
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          entries = json.loads(Path('docs/generated/theorems.json').read_text())
          assert isinstance(entries, list) and entries
          required = {
              'name', 'module', 'dependencies', 'dependents', 'compiledConsumers',
              'declarationDependencies', 'declarationConsumers', 'axioms',
              'standardAxioms', 'projectAxioms', 'externalAxioms',
              'projectAssumptions', 'replacementCandidates',
              'definitionallyEquivalentTo',
          }
          missing = required - entries[0].keys()
          assert not missing, f'missing fields: {sorted(missing)}'
          print(f'validated {len(entries)} theorem entries')
          PY

      - name: Build declaration graph site
        run: python3 scripts/build_declaration_graph_site.py
