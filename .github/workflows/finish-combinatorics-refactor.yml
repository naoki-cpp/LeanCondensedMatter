name: Finish Combinatorics Refactor

on:
  push:
    branches:
      - agent/reorganize-combinatorics
    paths:
      - scripts/finish_combinatorics_refactor.py
      - .github/workflows/finish-combinatorics-refactor.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/reorganize-combinatorics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply migration
        run: python scripts/finish_combinatorics_refactor.py
      - name: Remove one-shot migration files
        run: |
          rm scripts/finish_combinatorics_refactor.py
          rm .github/workflows/finish-combinatorics-refactor.yml
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: migrate remaining Combinatorics consumers"
          git push origin HEAD:agent/reorganize-combinatorics
