name: Theorem replacement probe

on:
  push:
    branches: [feat/theorem-replacement-audit]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore latest compatible project build
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Set up Lean and dependency cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto

      - name: Run theorem replacement audit
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -f 'AUDIT_ELAPSED=%e' lake env lean scripts/TheoremReplacementAudit.lean 2>&1 | tee replacement-audit.log

      - name: Report summary
        if: success()
        shell: bash
        run: |
          grep '^Generated theorem replacement audit' replacement-audit.log
          grep '^AUDIT_ELAPSED=' replacement-audit.log
