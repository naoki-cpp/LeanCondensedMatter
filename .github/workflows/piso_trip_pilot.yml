name: Piso-trip artifact pilot

# Temporary PR-only probe. Replace with an actual audit after reviewing the artifact.
on:
  pull_request:
    paths:
      - '.github/workflows/piso_trip_pilot.yml'

permissions: {}

jobs:
  artifact-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check research artifact metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p piso-trip-pilot
          echo 'Checking Zenodo record 23064352 (paper arXiv:2611.29603).' > piso-trip-pilot/status.txt
          if ! curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 60 --retry 2 --retry-max-time 120 --max-filesize 5000000 -o "$RUNNER_TEMP/piso-trip-record.json" 'https://zenodo.org/api/records/23064352' 2>>piso-trip-pilot/status.txt; then
            echo 'Artifact metadata unavailable; no code was downloaded or executed.' | tee -a piso-trip-pilot/status.txt
            exit 1
          fi
          jq -e '{id, doi, title: .metadata.title, license: .metadata.license, files: [.files[] | {key, size, checksum, links}] } | select(.id != null and .doi != null and (.files | length) > 0)' "$RUNNER_TEMP/piso-trip-record.json" > piso-trip-pilot/metadata.json
          echo 'Metadata retrieved; file names, checksums, license and download URLs require review before execution.' | tee -a piso-trip-pilot/status.txt

      - name: Report pilot status
        if: always()
        shell: bash
        run: |
          echo '## lean-piso-trip artifact pilot' >> "$GITHUB_STEP_SUMMARY"
          echo 'Metadata discovery only. No equivalence search or proof validation has been run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'See the uploaded pilot artifact and metadata step for the access result.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact discovery report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: piso-trip-pilot
          path: piso-trip-pilot/
          if-no-files-found: warn
          retention-days: 7
