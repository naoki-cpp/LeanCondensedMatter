name: Component Order Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Build component-order decomposition
        shell: bash
        run: |
          set +e
          lake build LeanCondensedMatter.SecondQuantization.Common.Diagrammatics.ComponentOrderDecomposition > component-order-build.log 2>&1
          echo "$?" > component-order-build.status
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: component-order-build-log
          path: |
            component-order-build.log
            component-order-build.status
      - name: Propagate build status
        shell: bash
        run: test "$(cat component-order-build.status)" -eq 0
