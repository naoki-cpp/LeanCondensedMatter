name: Migrate Fermionic Dyson Forwarding

on:
  push:
    branches:
      - agent/delete-fermionic-dyson-forwarding
    paths:
      - scripts/migrate_fermionic_dyson_forwarding.py
      - .github/workflows/migrate-fermionic-dyson-forwarding.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/delete-fermionic-dyson-forwarding
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Migrate fermionic Dyson callers
        run: python3 scripts/migrate_fermionic_dyson_forwarding.py
      - name: Check canonical architecture
        run: python3 scripts/check_second_quantization_architecture.py
      - name: Validate full library
        run: lake build --wfail
      - name: Check for sorry
        run: |
          if grep -rnE '\bsorry\b' --include='*.lean' LeanCondensedMatter; then
            exit 1
          fi
      - name: Remove one-shot migration files
        run: |
          rm scripts/migrate_fermionic_dyson_forwarding.py
          rm .github/workflows/migrate-fermionic-dyson-forwarding.yml
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor!: delete fermionic Dyson forwarding module"
          git push origin HEAD:agent/delete-fermionic-dyson-forwarding
