name: Organize Analysis modules

on:
  push:
    branches:
      - agent/organize-analysis-modules

permissions:
  contents: write

jobs:
  reorganize:
    if: github.event.head_commit.message == 'chore: stage Analysis reorganization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/organize-analysis-modules
          fetch-depth: 0

      - name: Move modules and update imports
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          moves = {
              "LeanCondensedMatter/Analysis/BinaryShuffleOrderedSimplex.lean":
                  "LeanCondensedMatter/Analysis/OrderedSimplex/BinaryShuffle.lean",
              "LeanCondensedMatter/Analysis/BinaryShuffleSlotOrderedSimplex.lean":
                  "LeanCondensedMatter/Analysis/OrderedSimplex/BinarySlotShuffle.lean",
              "LeanCondensedMatter/Analysis/FamilyShuffleOrderedSimplex.lean":
                  "LeanCondensedMatter/Analysis/OrderedSimplex/FamilyShuffle.lean",
              "LeanCondensedMatter/Analysis/CFC.lean":
                  "LeanCondensedMatter/Analysis/FunctionalCalculus/CFC.lean",
              "LeanCondensedMatter/Analysis/EigenvectorFamily.lean":
                  "LeanCondensedMatter/Analysis/Operator/Spectral/EigenvectorFamily.lean",
              "LeanCondensedMatter/Analysis/FinsuppProductSeries.lean":
                  "LeanCondensedMatter/Analysis/InfiniteSum/FinsuppProduct.lean",
              "LeanCondensedMatter/Analysis/FiberwiseTsum.lean":
                  "LeanCondensedMatter/Analysis/InfiniteSum/Fiberwise.lean",
              "LeanCondensedMatter/Analysis/HilbertBasisParseval.lean":
                  "LeanCondensedMatter/Analysis/InnerProductSpace/HilbertBasisParseval.lean",
              "LeanCondensedMatter/Analysis/HilbertSchmidtBasic.lean":
                  "LeanCondensedMatter/Analysis/Operator/HilbertSchmidt/Basic.lean",
              "LeanCondensedMatter/Analysis/HilbertSchmidtInnerProduct.lean":
                  "LeanCondensedMatter/Analysis/Operator/HilbertSchmidt/InnerProduct.lean",
              "LeanCondensedMatter/Analysis/HilbertSchmidtTrace.lean":
                  "LeanCondensedMatter/Analysis/Operator/HilbertSchmidt/Trace.lean",
              "LeanCondensedMatter/Analysis/OrderedSimplexIntegral.lean":
                  "LeanCondensedMatter/Analysis/OrderedSimplex/Integral.lean",
              "LeanCondensedMatter/Analysis/OrderedSimplexIntegralCalculus.lean":
                  "LeanCondensedMatter/Analysis/OrderedSimplex/Calculus.lean",
              "LeanCondensedMatter/Analysis/OrderedSimplexShuffleIntegral.lean":
                  "LeanCondensedMatter/Analysis/OrderedSimplex/ShuffleIntegral.lean",
              "LeanCondensedMatter/Analysis/PeierlsBogoliubov.lean":
                  "LeanCondensedMatter/Analysis/Inequalities/PeierlsBogoliubov.lean",
              "LeanCondensedMatter/Analysis/TraceClassBasic.lean":
                  "LeanCondensedMatter/Analysis/Operator/TraceClass/Basic.lean",
              "LeanCondensedMatter/Analysis/TraceClassOps.lean":
                  "LeanCondensedMatter/Analysis/Operator/TraceClass/Ops.lean",
              "LeanCondensedMatter/Analysis/TraceClassScalar.lean":
                  "LeanCondensedMatter/Analysis/Operator/TraceClass/Scalar.lean",
          }

          modules = {
              "LeanCondensedMatter.Analysis.BinaryShuffleOrderedSimplex":
                  "LeanCondensedMatter.Analysis.OrderedSimplex.BinaryShuffle",
              "LeanCondensedMatter.Analysis.BinaryShuffleSlotOrderedSimplex":
                  "LeanCondensedMatter.Analysis.OrderedSimplex.BinarySlotShuffle",
              "LeanCondensedMatter.Analysis.FamilyShuffleOrderedSimplex":
                  "LeanCondensedMatter.Analysis.OrderedSimplex.FamilyShuffle",
              "LeanCondensedMatter.Analysis.CFC":
                  "LeanCondensedMatter.Analysis.FunctionalCalculus.CFC",
              "LeanCondensedMatter.Analysis.EigenvectorFamily":
                  "LeanCondensedMatter.Analysis.Operator.Spectral.EigenvectorFamily",
              "LeanCondensedMatter.Analysis.FinsuppProductSeries":
                  "LeanCondensedMatter.Analysis.InfiniteSum.FinsuppProduct",
              "LeanCondensedMatter.Analysis.FiberwiseTsum":
                  "LeanCondensedMatter.Analysis.InfiniteSum.Fiberwise",
              "LeanCondensedMatter.Analysis.HilbertBasisParseval":
                  "LeanCondensedMatter.Analysis.InnerProductSpace.HilbertBasisParseval",
              "LeanCondensedMatter.Analysis.HilbertSchmidtBasic":
                  "LeanCondensedMatter.Analysis.Operator.HilbertSchmidt.Basic",
              "LeanCondensedMatter.Analysis.HilbertSchmidtInnerProduct":
                  "LeanCondensedMatter.Analysis.Operator.HilbertSchmidt.InnerProduct",
              "LeanCondensedMatter.Analysis.HilbertSchmidtTrace":
                  "LeanCondensedMatter.Analysis.Operator.HilbertSchmidt.Trace",
              "LeanCondensedMatter.Analysis.OrderedSimplexIntegral":
                  "LeanCondensedMatter.Analysis.OrderedSimplex.Integral",
              "LeanCondensedMatter.Analysis.OrderedSimplexIntegralCalculus":
                  "LeanCondensedMatter.Analysis.OrderedSimplex.Calculus",
              "LeanCondensedMatter.Analysis.OrderedSimplexShuffleIntegral":
                  "LeanCondensedMatter.Analysis.OrderedSimplex.ShuffleIntegral",
              "LeanCondensedMatter.Analysis.PeierlsBogoliubov":
                  "LeanCondensedMatter.Analysis.Inequalities.PeierlsBogoliubov",
              "LeanCondensedMatter.Analysis.TraceClassBasic":
                  "LeanCondensedMatter.Analysis.Operator.TraceClass.Basic",
              "LeanCondensedMatter.Analysis.TraceClassOps":
                  "LeanCondensedMatter.Analysis.Operator.TraceClass.Ops",
              "LeanCondensedMatter.Analysis.TraceClassScalar":
                  "LeanCondensedMatter.Analysis.Operator.TraceClass.Scalar",
          }

          for old, new in moves.items():
              old_path = Path(old)
              new_path = Path(new)
              if not old_path.is_file():
                  raise SystemExit(f"missing source module: {old}")
              new_path.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "mv", old, new], check=True)

          lean_files = [Path("LeanCondensedMatter.lean"), *Path("LeanCondensedMatter").rglob("*.lean")]
          for path in lean_files:
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in modules.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          for old in moves:
              if Path(old).exists():
                  raise SystemExit(f"old module still exists: {old}")
          for new in moves.values():
              if not Path(new).is_file():
                  raise SystemExit(f"new module missing: {new}")

          stale = []
          for path in lean_files:
              text = path.read_text(encoding="utf-8")
              for old in modules:
                  if old in text:
                      stale.append(f"{path}: {old}")
          if stale:
              raise SystemExit("stale Analysis module references:\n" + "\n".join(stale))
          PY

          git diff --check
          git status --short

      - name: Commit reorganization
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'refactor: organize Analysis modules'
          git push origin HEAD:agent/organize-analysis-modules
