name: Agent 1031 Theorem Catalog

on:
  push:
    branches:
      - agent/1031-fermionic-lattice

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Generate theorem catalog
        run: lake env lean scripts/TheoremCatalog.lean
