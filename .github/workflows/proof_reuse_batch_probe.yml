name: Proof Reuse Batch Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linked-cluster
            path: LeanCondensedMatter/SecondQuantization/Fermionic/Perturbation/AnalyticLinkedClusterTheorem.lean
          - label: diagram-flattening
            path: LeanCondensedMatter/SecondQuantization/Fermionic/Diagrammatics/DysonDiagramExpansion/Flattening.lean
          - label: orbital-angular-momentum
            path: LeanCondensedMatter/Analysis/Operator/OrbitalAngularMomentum.lean
          - label: massive-dirac-rung
            path: LeanCondensedMatter/Transport/Models/MassiveDirac/Disorder/BornCurrentVertexRung.lean
          - label: binary-shuffle-slots
            path: LeanCondensedMatter/Combinatorics/BinaryShuffleSlots.lean
          - label: trace-log
            path: LeanCondensedMatter/Permutation/TraceLog.lean
          - label: quantum-postulates
            path: LeanCondensedMatter/QuantumTheory/Postulates.lean
          - label: gibbs-pure-point
            path: LeanCondensedMatter/QuantumTheory/Gibbs/PurePoint.lean
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto
      - name: Build target module
        shell: bash
        env:
          TARGET: ${{ matrix.path }}
        run: |
          set -euo pipefail
          MODULE="${TARGET%.lean}"
          MODULE="${MODULE//\//.}"
          lake build "$MODULE"
      - name: Audit bounded proof regions
        shell: bash
        env:
          TARGET: ${{ matrix.path }}
        run: |
          set -o pipefail
          python3 scripts/proof_reuse_audit.py "$TARGET" \
            --modes exact,simp \
            --max-blocks 8 \
            --max-span-tactics 5 \
            --max-intervals-per-block 3 \
            --max-findings 5 \
            --max-suggestions-per-search 2 \
            --timeout 20 \
            --no-baseline 2>&1 | tee proof-reuse-batch.log || true
