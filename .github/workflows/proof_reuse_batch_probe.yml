name: Proof Reuse Batch Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linked-cluster-long-exact
            path: LeanCondensedMatter/SecondQuantization/Fermionic/Perturbation/AnalyticLinkedClusterTheorem.lean
          - label: diagram-flattening-long-exact
            path: LeanCondensedMatter/SecondQuantization/Fermionic/Diagrammatics/DysonDiagramExpansion/Flattening.lean
          - label: binary-shuffle-slots-long-exact
            path: LeanCondensedMatter/Combinatorics/BinaryShuffleSlots.lean
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto
      - name: Build target module
        shell: bash
        env:
          TARGET: ${{ matrix.path }}
        run: |
          set -euo pipefail
          MODULE="${TARGET%.lean}"
          MODULE="${MODULE//\//.}"
          lake build "$MODULE"
      - name: Audit narrow exact regions with longer timeout
        shell: bash
        env:
          TARGET: ${{ matrix.path }}
        run: |
          set -o pipefail
          python3 scripts/proof_reuse_audit.py "$TARGET" \
            --modes exact \
            --max-blocks 8 \
            --max-span-tactics 5 \
            --max-intervals-per-block 1 \
            --max-findings 3 \
            --max-suggestions-per-search 1 \
            --timeout 60 \
            --no-baseline 2>&1 | tee proof-reuse-long-exact.log || true
