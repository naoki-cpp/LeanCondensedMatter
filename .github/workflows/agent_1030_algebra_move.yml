name: Agent 1030 algebra migration

on:
  push:
    branches:
      - agent/1030-fermionic-algebraic-fock

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Move algebraic Fock stack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('LeanCondensedMatter/SecondQuantization/Fermionic')
          old_root = root / 'Field'
          new_root = root / 'Algebra' / 'AlgebraicFock'
          new_root.mkdir(parents=True, exist_ok=True)

          moves = {
              'FiniteParticleFock.lean': 'Basic.lean',
              'Creation.lean': 'Creation.lean',
              'Annihilation.lean': 'Annihilation.lean',
              'Mode.lean': 'Mode.lean',
              'OccupationEquivalence.lean': 'OccupationEquivalence.lean',
              'OccupationFieldEquivalence.lean': 'OccupationFieldEquivalence.lean',
              'SecondQuantization.lean': 'SecondQuantization.lean',
              'SecondQuantizationLinearity.lean': 'SecondQuantizationLinearity.lean',
              'SecondQuantizationCommutator.lean': 'SecondQuantizationCommutator.lean',
          }

          module_map = {
              'LeanCondensedMatter.SecondQuantization.Fermionic.Field.FiniteParticleFock':
                  'LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.Basic',
              'LeanCondensedMatter.SecondQuantization.Fermionic.Field.Creation':
                  'LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.Creation',
              'LeanCondensedMatter.SecondQuantization.Fermionic.Field.Annihilation':
                  'LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.Annihilation',
              'LeanCondensedMatter.SecondQuantization.Fermionic.Field.Mode':
                  'LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.Mode',
              'LeanCondensedMatter.SecondQuantization.Fermionic.Field.OccupationEquivalence':
                  'LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.OccupationEquivalence',
              'LeanCondensedMatter.SecondQuantization.Fermionic.Field.OccupationFieldEquivalence':
                  'LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.OccupationFieldEquivalence',
              'LeanCondensedMatter.SecondQuantization.Fermionic.Field.SecondQuantization':
                  'LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.SecondQuantization',
              'LeanCondensedMatter.SecondQuantization.Fermionic.Field.SecondQuantizationLinearity':
                  'LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.SecondQuantizationLinearity',
              'LeanCondensedMatter.SecondQuantization.Fermionic.Field.SecondQuantizationCommutator':
                  'LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.SecondQuantizationCommutator',
          }

          moved_paths = []
          for old_name, new_name in moves.items():
              src = old_root / old_name
              dst = new_root / new_name
              if src.exists():
                  shutil.move(str(src), str(dst))
              moved_paths.append(dst)

          # Rewrite imports repository-wide.
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix not in {'.lean', '.md', '.py'}:
                  continue
              text = path.read_text(encoding='utf-8')
              new = text
              for old, target in module_map.items():
                  new = new.replace(old, target)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          # The moved declarations are now owned by the AlgebraicFock namespace.
          for path in moved_paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace('namespace Field\n', 'namespace AlgebraicFock\n')
              text = text.replace('end Field\n', 'end AlgebraicFock\n')
              path.write_text(text, encoding='utf-8')

          # Add a responsibility-specific umbrella.
          umbrella = root / 'Algebra' / 'AlgebraicFock.lean'
          umbrella.write_text('''import LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.Basic\nimport LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.Creation\nimport LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.Annihilation\nimport LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.Mode\nimport LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.OccupationEquivalence\nimport LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.OccupationFieldEquivalence\nimport LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.SecondQuantization\nimport LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.SecondQuantizationLinearity\nimport LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock.SecondQuantizationCommutator\n\nset_option linter.style.header false\n\n/-!\n# Basis-independent fermionic algebraic Fock space\n\nThe exterior-algebra Fock representation, smeared creation and annihilation operators, CAR,\nmode specializations, occupation-representation equivalences, and algebraic second quantization.\nThis layer does not depend on lattice, transport, finite-volume, or validation modules.\n-/\n''', encoding='utf-8')

          algebra = root / 'Algebra.lean'
          text = algebra.read_text(encoding='utf-8')
          imp = 'import LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock\n'
          if imp not in text:
              text = imp + text
          algebra.write_text(text, encoding='utf-8')

          field = root / 'Field.lean'
          text = field.read_text(encoding='utf-8')
          moved_imports = [f'import {x}\n' for x in module_map.values()]
          for imp_line in moved_imports:
              text = text.replace(imp_line, '')
          dep = 'import LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.AlgebraicFock\n'
          if dep not in text:
              text = dep + text
          text = text.replace(
              'Basis-independent fermionic finite-particle Fock spaces, smeared fields, second quantization, and\ncontinuity-derived currents.',
              'Fermionic lattice fields, response adapters, and continuity-derived currents. The basis-independent\nalgebraic Fock core is owned by `Fermionic.Algebra.AlgebraicFock`.'
          )
          field.write_text(text, encoding='utf-8')

          # Architecture docs: canonical owner and public namespace.
          for doc in [Path('notes/architecture/fermionic-field-operators.md'),
                      Path('notes/roadmaps/second-quantization-status.md')]:
              if not doc.exists():
                  continue
              text = doc.read_text(encoding='utf-8')
              text = text.replace('Field.occupationEquiv', 'AlgebraicFock.occupationEquiv')
              text = text.replace('`Fermionic.Field`', '`Fermionic.Algebra.AlgebraicFock`')
              doc.write_text(text, encoding='utf-8')
          PY
      - name: Commit migration
        shell: bash
        run: |
          rm .github/workflows/agent_1030_algebra_move.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(fermionic-algebra): move algebraic Fock core"
          git push
