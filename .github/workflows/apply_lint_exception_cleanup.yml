name: Apply lint exception cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/reduce-lint-exceptions'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/reduce-lint-exceptions
          fetch-depth: 0

      - name: Apply low-risk lint exception cleanup
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          edits = {
              "LeanCondensedMatter/Analysis/Operator/DiagonalExpectation.lean": [
                  (
                      "@[simp]\ntheorem coe_diagonalExpectationValue\n",
                      "theorem coe_diagonalExpectationValue\n",
                  ),
                  (
                      "@[simp, nolint simpNF]\ntheorem coe_diagonalExpectationValue_right",
                      "@[simp]\ntheorem coe_diagonalExpectationValue_right",
                  ),
              ],
              "LeanCondensedMatter/QuantumTheory/DensityOperator/Expectation.lean": [
                  (
                      "@[simp]\ntheorem DensityOperator.expectation_apply",
                      "theorem DensityOperator.expectation_apply",
                  ),
                  (
                      "@[simp, nolint simpNF]\ntheorem DensityOperator.expectation_id",
                      "@[simp]\ntheorem DensityOperator.expectation_id",
                  ),
              ],
              "LeanCondensedMatter/QuantumTheory/DensityOperator/Purity.lean": [
                  (
                      "@[simp, nolint simpNF]\ntheorem DensityOperator.expectation_op",
                      "@[simp]\ntheorem DensityOperator.expectation_op",
                  ),
              ],
              "LeanCondensedMatter/QuantumTheory/Gibbs/EnergyExpectation.lean": [
                  (
                      "@[simp, nolint simpNF]\ntheorem DensityOperator.expectation_observable",
                      "@[simp]\ntheorem DensityOperator.expectation_observable",
                  ),
              ],
              "LeanCondensedMatter/Combinatorics/Cumulant/Inversion.lean": [
                  (
                      "@[simp, nolint simpNF]\ntheorem partitionProduct_top {S : Finset α} (hS : S ≠ ⊥)",
                      "@[simp]\ntheorem partitionProduct_top {S : Finset α} (hS : S ≠ ∅)",
                  ),
              ],
              "LeanCondensedMatter/QuantumTheory/LinearResponse/KuboFormula.lean": [
                  (
                      "@[simp, nolint simpNF]\ntheorem timeDependentPerturbedExpectationFunctional_zero_coupling_apply",
                      "theorem timeDependentPerturbedExpectationFunctional_zero_coupling_apply",
                  ),
              ],
              "LeanCondensedMatter/SecondQuantization/Common/Perturbation/AnalyticDysonExponential.lean": [
                  (
                      "@[simp, nolint simpNF]\ntheorem smul_continuousDiagonalHamiltonian_basis_apply",
                      "theorem smul_continuousDiagonalHamiltonian_basis_apply",
                  ),
              ],
              "LeanCondensedMatter/SecondQuantization/Common/Perturbation/AnalyticDysonTrace.lean": [
                  (
                      "@[simp, nolint simpNF]\ntheorem finiteOperatorTrace_finiteContinuousOperator",
                      "theorem finiteOperatorTrace_finiteContinuousOperator",
                  ),
              ],
              "LeanCondensedMatter/QuantumTheory/Postulates.lean": [
                  (
                      "@[nolint unusedArguments]\ndef State (H : Type*) [NormedAddCommGroup H] [InnerProductSpace ℂ H] :=",
                      "def State (H : Type*) [NormedAddCommGroup H] :=",
                  ),
              ],
              "LeanCondensedMatter/SecondQuantization/Bosonic/Algebra/FockSpace.lean": [
                  (
                      "@[nolint unusedArguments]\nabbrev FockSpace (Mode : Type*) [DecidableEq Mode] :=",
                      "abbrev FockSpace (Mode : Type*) :=",
                  ),
              ],
              "LeanCondensedMatter/SecondQuantization/Fermionic/Algebra/FockSpace.lean": [
                  (
                      "@[nolint unusedArguments]\nabbrev FockSpace (Mode : Type*) [DecidableEq Mode] :=",
                      "abbrev FockSpace (Mode : Type*) :=",
                  ),
              ],
              "LeanCondensedMatter/SecondQuantization/Fermionic/Diagrammatics/WickDiagram.lean": [
                  (
                      "@[nolint unusedArguments]\nnoncomputable instance QuarticWickDiagram.instFintype [DecidableEq Mode] [Fintype Mode]",
                      "noncomputable instance QuarticWickDiagram.instFintype [Fintype Mode]",
                  ),
              ],
              "LeanCondensedMatter/SecondQuantization/Fermionic/Perturbation/DysonVertexMoment.lean": [
                  (
                      "@[nolint unusedArguments]\nnoncomputable def dysonVertexMoment {α : Type*} [DecidableEq α]",
                      "noncomputable def dysonVertexMoment {α : Type*}",
                  ),
              ],
              "LeanCondensedMatter/Combinatorics/IncidenceAlgebra/Mobius.lean": [
                  (
                      "@[nolint unusedArguments]\nnoncomputable instance instLocallyFiniteOrderSubtypeLe {α : Type*} [Fintype α] [PartialOrder α]\n    [LocallyFiniteOrder α] [DecidableEq α] {z : α}",
                      "noncomputable instance instLocallyFiniteOrderSubtypeLe {α : Type*} [Fintype α]\n    [PartialOrder α] {z : α}",
                  ),
              ],
          }

          for filename, replacements in edits.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"{filename}: expected one match for {old!r}, found {count}"
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

          git add LeanCondensedMatter
          git rm .github/workflows/apply_lint_exception_cleanup.yml
          git commit -m "refactor: reduce targeted lint exceptions"
          git push origin HEAD:agent/reduce-lint-exceptions
