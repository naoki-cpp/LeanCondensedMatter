name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not let a long documentation build block CI on unrelated branches. For repeated
# pushes to the same ref, only the newest run is useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Check architecture
        run: python3 scripts/check_architecture.py
      - uses: leanprover/lean-action@v1
        with:
          # Keep the whole library warning-free, including modules unchanged by the PR.
          build: true
          build-args: "--wfail"
          lint: true
      - name: Check compiled declarations for sorryAx
        run: lake env lean scripts/CheckNoSorry.lean

  # Generated developer artifacts are intentionally built only on pushes to main. Both theorem
  # catalog generation and doc-gen4 consume the compiled Lean environment, so keep them on one
  # runner rather than starting independent workflows for the same commit.
  docs:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Cache only the nested documentation build here. lean-action already maintains
      # the root .lake cache with its own commit-aware key.
      - name: Restore documentation cache
        uses: actions/cache@v4
        with:
          path: |
            docbuild/.lake/build
            docbuild/lake-manifest.json
          # GitHub caches are immutable, so include the commit SHA to save a fresh
          # incremental snapshot after every successful main build. The restore prefix
          # selects the newest snapshot with the same Lean and dependency versions.
          key: docgen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            docgen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - uses: leanprover/lean-action@v1

      - name: Generate theorem catalog
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/TheoremCatalog.lean 2>&1 | tee theorem-catalog.log

      - name: Add theorem catalog summary
        if: success()
        run: |
          echo "## Theorem catalog" >> "$GITHUB_STEP_SUMMARY"
          grep '^Theorems:' docs/generated/theorems.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The complete Markdown and JSON catalogs are attached as a workflow artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload theorem catalog
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: theorem-catalog
          path: |
            docs/generated/theorems.md
            docs/generated/theorems.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload theorem catalog generator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theorem-catalog-log
          path: theorem-catalog.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build API documentation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docbuild
          cat > docbuild/lakefile.toml <<EOF
          name = "docbuild"
          reservoir = false
          version = "0.1.0"
          packagesDir = "../.lake/packages"

          [[require]]
          name = "LeanCondensedMatter"
          path = "../"

          [[require]]
          scope = "leanprover"
          name = "doc-gen4"
          rev = "$(cut -f 2 -d: lean-toolchain)"
          EOF

          (
            cd docbuild
            MATHLIB_NO_CACHE_ON_UPDATE=1 ~/.elan/bin/lake update LeanCondensedMatter
            ~/.elan/bin/lake build LeanCondensedMatter:docs
          )

      - name: Assemble themed documentation site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site/docs
          cp -R docbuild/.lake/build/doc/. site/docs/
          cat docs-site/docgen.css >> site/docs/style.css
          cp docs-site/project-nav.js site/docs/
          cp docs-site/index.html docs-site/site.css site/

          python3 - <<'PY'
          from pathlib import Path

          navbar = Path("site/docs/navbar.html")
          html = navbar.read_text(encoding="utf-8")
          script = '  <script type="module" src="./project-nav.js"></script>\n'
          closing_tag = "</body>"

          if closing_tag not in html:
              raise SystemExit("doc-gen4 navbar.html does not contain </body>")

          navbar.write_text(
              html.replace(closing_tag, script + closing_tag, 1),
              encoding="utf-8",
          )
          PY

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site
          if-no-files-found: error
          retention-days: 30
