name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - name: Execute one-shot Common layout refactor
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/organize-common-layout'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ ! -f .github/scripts/refactor_common_layout.py ]]; then
            exit 0
          fi
          git fetch origin main --depth=1
          python3 .github/scripts/refactor_common_layout.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: organize Common source directories"
          git push origin "HEAD:${HEAD_BRANCH}"
      - uses: leanprover/lean-action@v1
      - name: Check for sorry
        run: |
          if grep -rnE '\bsorry\b' --include='*.lean' LeanCondensedMatter; then
            echo "::error::Found 'sorry' in the Lean sources above. Per PROJECT.md, a statement is only 'proved' with no 'sorry' — record it as a target in notes/roadmap.md instead of leaving it in place."
            exit 1
          fi

  docs:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Restore documentation cache
        uses: actions/cache@v4
        with:
          path: |
            docbuild/.lake/build
            docbuild/lake-manifest.json
          key: docgen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            docgen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - uses: leanprover/lean-action@v1

      - name: Build API documentation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docbuild
          cat > docbuild/lakefile.toml <<EOF
          name = "docbuild"
          reservoir = false
          version = "0.1.0"
          packagesDir = "../.lake/packages"

          [[require]]
          name = "LeanCondensedMatter"
          path = "../"

          [[require]]
          scope = "leanprover"
          name = "doc-gen4"
          rev = "$(cut -f 2 -d: lean-toolchain)"
          EOF

          (
            cd docbuild
            MATHLIB_NO_CACHE_ON_UPDATE=1 ~/.elan/bin/lake update LeanCondensedMatter
            ~/.elan/bin/lake build LeanCondensedMatter:docs
          )

      - name: Assemble themed documentation site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site/docs
          cp -R docbuild/.lake/build/doc/. site/docs/
          cat docs-site/docgen.css >> site/docs/style.css
          cp docs-site/project-nav.js site/docs/
          cp docs-site/index.html docs-site/site.css site/

          python3 - <<'PY'
          from pathlib import Path

          navbar = Path("site/docs/navbar.html")
          html = navbar.read_text(encoding="utf-8")
          script = '  <script type="module" src="./project-nav.js"></script>\n'
          closing_tag = "</body>"

          if closing_tag not in html:
              raise SystemExit("doc-gen4 navbar.html does not contain </body>")

          navbar.write_text(
              html.replace(closing_tag, script + closing_tag, 1),
              encoding="utf-8",
          )
          PY

          touch site/.nojekyll

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
