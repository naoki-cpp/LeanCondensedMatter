name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Do not let a long documentation build block CI on unrelated branches. For repeated
# pushes to the same ref, only the newest run is useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - name: Build Lean project
        id: lean-build
        shell: bash
        run: |
          set +e
          lake build > lean-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload failed Lean build log
        if: steps.lean-build.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-errors
          path: lean-build.log
      - name: Fail on Lean build error
        if: steps.lean-build.outputs.status != '0'
        run: exit 1
      - name: Check for sorry
        if: steps.lean-build.outputs.status == '0'
        run: |
          if grep -rnE '\bsorry\b' --include='*.lean' LeanCondensedMatter; then
            echo "::error::Found 'sorry' in the Lean sources above. Per PROJECT.md, a statement is only 'proved' with no 'sorry' — record it as a target in notes/roadmap.md instead of leaving it in place."
            exit 1
          fi

  # Documentation is intentionally built only on pushes to main. doc-gen4 processes the
  # full Mathlib symbol set, so running it for every pull request would be unnecessarily slow.
  docs:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      # Cache only the nested documentation build here. lean-action already maintains
      # the root .lake cache with its own commit-aware key.
      - name: Restore documentation cache
        uses: actions/cache@v4
        with:
          path: |
            docbuild/.lake/build
            docbuild/lake-manifest.json
          # GitHub caches are immutable, so include the commit SHA to save a fresh
          # incremental snapshot after every successful main build. The restore prefix
          # selects the newest snapshot with the same Lean and dependency versions.
          key: docgen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            docgen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - uses: leanprover/lean-action@v1

      - name: Build API documentation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docbuild
          cat > docbuild/lakefile.toml <<EOF
          name = "docbuild"
          reservoir = false
          version = "0.1.0"
          packagesDir = "../.lake/packages"

          [[require]]
          name = "LeanCondensedMatter"
          path = "../"

          [[require]]
          scope = "leanprover"
          name = "doc-gen4"
          rev = "$(cut -f 2 -d: lean-toolchain)"
          EOF

          (
            cd docbuild
            MATHLIB_NO_CACHE_ON_UPDATE=1 ~/.elan/bin/lake update LeanCondensedMatter
            ~/.elan/bin/lake build LeanCondensedMatter:docs
          )

      - name: Assemble themed documentation site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site/docs
          cp -R docbuild/.lake/build/doc/. site/docs/
          cat docs-site/docgen.css >> site/docs/style.css
          cp docs-site/project-nav.js site/docs/
          cp docs-site/index.html docs-site/site.css site/

          python3 - <<'PY'
          from pathlib import Path

          navbar = Path("site/docs/navbar.html")
          html = navbar.read_text(encoding="utf-8")
          script = '  <script type="module" src="./project-nav.js"></script>\n'
          closing_tag = "</body>"

          if closing_tag not in html:
              raise SystemExit("doc-gen4 navbar.html does not contain </body>")

          navbar.write_text(
              html.replace(closing_tag, script + closing_tag, 1),
              encoding="utf-8",
          )
          PY

          touch site/.nojekyll

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
