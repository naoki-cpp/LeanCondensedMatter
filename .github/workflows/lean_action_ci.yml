name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# For repeated pushes to the same ref, only the newest required CI run is useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.source == 'true' }}
      lean: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.lean == 'true' }}
      advisory: ${{ steps.filter.outputs.advisory == 'true' }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 20

      - name: Detect CI-related changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.3
        with:
          base: ${{ github.ref }}
          filters: |
            source:
              - 'LeanCondensedMatter.lean'
              - 'LeanCondensedMatter/**/*.lean'
              - 'scripts/check_architecture.py'
              - 'scripts/check_architecture_graphs.py'
              - 'scripts/check_source_contracts.py'
              - 'scripts/check_transport_hierarchy.py'
              - 'scripts/check_diagrammatics_umbrella_boundaries.py'
              - 'scripts/architecture_audit_common.py'
              - 'scripts/architecture_graph_scopes.py'
              - 'scripts/architecture/*.json'
              - '.github/workflows/lean_action_ci.yml'
            lean:
              - 'LeanCondensedMatter.lean'
              - 'LeanCondensedMatter/**/*.lean'
              - 'lean-toolchain'
              - 'lakefile.toml'
              - 'lake-manifest.json'
              - 'scripts/CheckDuplicates.lean'
              - 'scripts/CheckNoSorry.lean'
              - '.github/workflows/lean_action_ci.yml'
            advisory:
              - 'scripts/CheckUnusedHypotheses.lean'
              - 'scripts/TheoremCatalog.lean'
              - 'scripts/TheoremReplacementAudit.lean'
              - 'scripts/merge_theorem_replacements.py'
              - '.github/workflows/insights.yml'

  source-checks:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check source architecture
        run: python3 scripts/check_architecture.py

  build:
    needs: changes
    if: needs.changes.outputs.lean == 'true' || (github.event_name == 'push' && needs.changes.outputs.advisory == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Mathlib's own binary cache restores dependency build products. Keep only this project's
      # build output in GitHub Cache instead of duplicating the full multi-gigabyte `.lake` tree.
      - name: Restore project build cache
        id: project-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Build Lean library
        id: lean-build
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          # Keep the whole library warning-free, including modules unchanged by the PR.
          build: true
          build-args: "--wfail"
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto

      - name: Save project build cache
        if: steps.lean-build.outcome == 'success' && steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: ${{ steps.project-cache.outputs.cache-primary-key }}

      - name: Report Lean cache footprint
        if: always()
        shell: bash
        run: |
          echo "## Lean cache footprint" >> "$GITHUB_STEP_SUMMARY"
          for path in .lake/build .lake/packages; do
            if [ -e "$path" ]; then
              du -sh "$path" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

  # These independent compiled checks are intentionally parallel: they all consume the same
  # successful build and optimize pull-request wall-clock time rather than runner-minutes.
  compiled-checks:
    needs: [changes, build]
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check:
          - duplicates
          - no-sorry
          - lint

    name: compiled-checks (${{ matrix.check }})

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore compiled project
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Set up Lean and dependency cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto

      - name: Check duplicate declarations
        if: matrix.check == 'duplicates'
        run: lake env lean scripts/CheckDuplicates.lean

      - name: Check compiled declarations for sorryAx
        if: matrix.check == 'no-sorry'
        run: lake env lean scripts/CheckNoSorry.lean

      - name: Lint public library
        if: matrix.check == 'lint'
        run: lake lint

  # Stable aggregate status for branch protection. Keep the expensive work in parallel above,
  # while exposing one durable required-check name.
  ci:
    if: always()
    needs: [changes, source-checks, build, compiled-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SOURCE_RELATED: ${{ needs.changes.outputs.source }}
          LEAN_RELATED: ${{ needs.changes.outputs.lean }}
          ADVISORY_RELATED: ${{ needs.changes.outputs.advisory }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_CHECKS_RESULT: ${{ needs.source-checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COMPILED_CHECKS_RESULT: ${{ needs.compiled-checks.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$SOURCE_RELATED" = true ]; then
            test "$SOURCE_CHECKS_RESULT" = success
          fi
          if [ "$LEAN_RELATED" = true ]; then
            test "$BUILD_RESULT" = success
            test "$COMPILED_CHECKS_RESULT" = success
          elif [ "$EVENT_NAME" = push ] && [ "$ADVISORY_RELATED" = true ]; then
            test "$BUILD_RESULT" = success
          fi
          if [ "$SOURCE_RELATED" != true ] && [ "$LEAN_RELATED" != true ]; then
            if [ "$EVENT_NAME" != push ] || [ "$ADVISORY_RELATED" != true ]; then
              echo "No source-architecture or Lean-build checks were needed."
            fi
          fi
