name: Lean Action CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Normalize diagrammatics roadmap formatting
        id: docs-update
        continue-on-error: true
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/final-second-quantization-docs'
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/second-quantization-doc-update.log) 2>&1
          git fetch origin +refs/heads/agent/final-second-quantization-docs:refs/remotes/origin/agent/final-second-quantization-docs
          git checkout -B agent/final-second-quantization-docs origin/agent/final-second-quantization-docs
          python3 - <<'PY'
          from pathlib import Path

          path = Path("notes/roadmaps/second-quantization.md")
          text = path.read_text(encoding="utf-8")
          start = text.find("    - PR 3, `Fermionic/Diagrammatics/QuarticInteraction.lean`")
          end = text.find("\n7. **Not started**", start)
          if start < 0 or end < 0:
              raise SystemExit("could not locate the diagrammatics history section")

          replacement = """    - PR 3, `Fermionic/Diagrammatics/QuarticInteraction.lean` — the first concrete,
              generally non-diagonal quartic vertex `Σ g(q) cᵢ†cⱼ†cₗcₖ` (no
              Hermiticity/antisymmetry/momentum-conservation baked in yet).
            - PR 4a/4b introduced the quartic Wick-diagram data and connectedness layer in
              `Fermionic/Diagrammatics/WickDiagram.lean` and
              `Fermionic/Diagrammatics/WickDiagram/Connected.lean`.
            - PR 5a/5b/5c added `Analysis/OrderedSimplexIntegral.lean`, pairing relabelling,
              `Fermionic/Diagrammatics/WickDiagram/Ordered.lean`, and
              `Fermionic/Diagrammatics/WickDiagram/Amplitude.lean`.
            - PR 6 proved the Dyson diagram expansion in
              `Fermionic/Diagrammatics/DysonDiagramExpansion.lean`, using the flattened local-leg
              semantics from `Fermionic/Diagrammatics/WickDiagram/LegFamily.lean` and
              `Fermionic/Diagrammatics/QuarticLocalLeg.lean`.
            - PR 7 completed component partition, restriction, connectedness, reassembly, the
              decomposition equivalence, and scalar-prefactor factorization under
              `Fermionic/Diagrammatics/WickDiagram/`. The remaining full-amplitude factorization is the
              ordered-simplex shuffle together with pairing-weight and pair-value compatibility under
              component-local orders; after that come the finite-set LCT and the `PowerSeries.log`
              coefficient bridge.
          """
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/roadmaps/second-quantization.md
          git commit -m "docs: normalize diagrammatics roadmap formatting"
          git push origin HEAD:agent/final-second-quantization-docs

      - name: Upload documentation updater diagnostics
        if: steps.docs-update.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: second-quantization-doc-update-log
          path: /tmp/second-quantization-doc-update.log

      - name: Fail after documentation updater error
        if: steps.docs-update.outcome == 'failure'
        run: exit 1

      - uses: leanprover/lean-action@v1
      - name: Check for sorry
        run: |
          if grep -rnE '\bsorry\b' --include='*.lean' LeanCondensedMatter; then
            echo "::error::Found 'sorry' in the Lean sources above."
            exit 1
          fi
