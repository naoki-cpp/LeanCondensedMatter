name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# For repeated pushes to the same ref, only the newest run is useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the pull-request gate as one stable job. This avoids repeatedly restoring the
  # same build and re-running Lean setup for independent compiled audits.
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check source architecture
        run: python3 scripts/check_architecture.py

      # Mathlib's own binary cache restores dependency build products. Keep only this project's
      # build output in GitHub Cache instead of duplicating the full multi-gigabyte `.lake` tree.
      - name: Restore project build cache
        id: project-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Build Lean library
        id: lean-build
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          # Keep the whole library warning-free, including modules unchanged by the PR.
          build: true
          build-args: "--wfail"
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto

      - name: Save project build cache
        if: steps.lean-build.outcome == 'success' && steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: ${{ steps.project-cache.outputs.cache-primary-key }}

      - name: Check duplicate declarations
        run: lake env lean scripts/CheckDuplicates.lean

      - name: Check compiled declarations for sorryAx
        run: lake env lean scripts/CheckNoSorry.lean

      - name: Lint public library
        run: lake lint

      - name: Report Lean cache footprint
        if: always()
        shell: bash
        run: |
          echo "## Lean cache footprint" >> "$GITHUB_STEP_SUMMARY"
          for path in .lake/build .lake/packages; do
            if [ -e "$path" ]; then
              du -sh "$path" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

  # Generated developer artifacts and advisory audits run only on pushes to main. They consume
  # the compiled Lean environment but are not part of the pull-request correctness gate.
  docs:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore project build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Restore documentation cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            docbuild/.lake/build
            docbuild/lake-manifest.json
          # GitHub caches are immutable, so include the commit SHA to save a fresh
          # incremental snapshot after every successful main build. The restore prefix
          # selects the newest snapshot with the same Lean and dependency versions.
          key: docgen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            docgen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Set up Lean and dependency cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto

      - name: Audit potentially unused theorem hypotheses
        run: lake env lean scripts/CheckUnusedHypotheses.lean

      - name: Add unused hypothesis audit summary
        if: always()
        shell: bash
        run: |
          if [ -f unused-hypotheses.md ]; then
            cat unused-hypotheses.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate theorem catalog
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/TheoremCatalog.lean 2>&1 | tee theorem-catalog.log

      - name: Add theorem catalog summary
        if: success()
        run: |
          echo "## Theorem catalog" >> "$GITHUB_STEP_SUMMARY"
          grep '^Theorems:' docs/generated/theorems.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The complete Markdown and JSON catalogs are attached as a workflow artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload theorem catalog
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: theorem-catalog
          path: |
            docs/generated/theorems.md
            docs/generated/theorems.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload theorem catalog generator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theorem-catalog-log
          path: theorem-catalog.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build API documentation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docbuild
          cat > docbuild/lakefile.toml <<EOF
          name = "docbuild"
          reservoir = false
          version = "0.1.0"
          packagesDir = "../.lake/packages"

          [[require]]
          name = "LeanCondensedMatter"
          path = "../"

          [[require]]
          scope = "leanprover"
          name = "doc-gen4"
          rev = "$(cut -f 2 -d: lean-toolchain)"
          EOF

          (
            cd docbuild
            MATHLIB_NO_CACHE_ON_UPDATE=1 ~/.elan/bin/lake update LeanCondensedMatter
            ~/.elan/bin/lake build LeanCondensedMatter:docs
          )

      - name: Assemble themed documentation site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site/docs
          cp -R docbuild/.lake/build/doc/. site/docs/
          cat docs-site/docgen.css >> site/docs/style.css
          cp docs-site/project-nav.js site/docs/
          cp docs-site/index.html docs-site/site.css site/

          python3 - <<'PY'
          from pathlib import Path

          navbar = Path("site/docs/navbar.html")
          html = navbar.read_text(encoding="utf-8")
          script = '  <script type="module" src="./project-nav.js"></script>\n'
          closing_tag = "</body>"

          if closing_tag not in html:
              raise SystemExit("doc-gen4 navbar.html does not contain </body>")

          navbar.write_text(
              html.replace(closing_tag, script + closing_tag, 1),
              encoding="utf-8",
          )
          PY

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site
          if-no-files-found: error
          retention-days: 30
