name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# For repeated pushes to the same ref, only the newest run is useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lean: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.lean == 'true' }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 20

      - name: Detect Lean-related changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.3
        with:
          base: ${{ github.ref }}
          filters: |
            lean:
              - '**/*.lean'
              - 'lean-toolchain'
              - 'lakefile.toml'
              - 'lake-manifest.json'
              - 'scripts/**/*.py'
              - 'scripts/architecture/**'
              - '.github/workflows/lean_action_ci.yml'

  source-checks:
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check source architecture
        run: python3 scripts/check_architecture.py

  build:
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Mathlib's own binary cache restores dependency build products. Keep only this project's
      # build output in GitHub Cache instead of duplicating the full multi-gigabyte `.lake` tree.
      - name: Restore project build cache
        id: project-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Build Lean library
        id: lean-build
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          # Keep the whole library warning-free, including modules unchanged by the PR.
          build: true
          build-args: "--wfail"
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto

      - name: Save project build cache
        if: steps.lean-build.outcome == 'success' && steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: ${{ steps.project-cache.outputs.cache-primary-key }}

      - name: Report Lean cache footprint
        if: always()
        shell: bash
        run: |
          echo "## Lean cache footprint" >> "$GITHUB_STEP_SUMMARY"
          for path in .lake/build .lake/packages; do
            if [ -e "$path" ]; then
              du -sh "$path" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

  # These independent compiled checks are intentionally parallel: they all consume the same
  # successful build and optimize pull-request wall-clock time rather than runner-minutes.
  compiled-checks:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check:
          - duplicates
          - no-sorry
          - lint

    name: compiled-checks (${{ matrix.check }})

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore compiled project
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Set up Lean and dependency cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto

      - name: Check duplicate declarations
        if: matrix.check == 'duplicates'
        run: lake env lean scripts/CheckDuplicates.lean

      - name: Check compiled declarations for sorryAx
        if: matrix.check == 'no-sorry'
        run: lake env lean scripts/CheckNoSorry.lean

      - name: Lint public library
        if: matrix.check == 'lint'
        run: lake lint

  # Stable aggregate status for branch protection. Keep the expensive work in parallel above,
  # while exposing one durable required-check name.
  ci:
    if: always()
    needs: [changes, source-checks, build, compiled-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LEAN_RELATED: ${{ needs.changes.outputs.lean }}
          SOURCE_CHECKS_RESULT: ${{ needs.source-checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COMPILED_CHECKS_RESULT: ${{ needs.compiled-checks.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$LEAN_RELATED" != true ]; then
            echo "No Lean-related changes; Lean code checks were skipped."
            exit 0
          fi
          test "$SOURCE_CHECKS_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$COMPILED_CHECKS_RESULT" = success

  # Generated developer artifacts and advisory audits run on pushes to main and explicit manual
  # dispatches. They consume the compiled Lean environment but are not part of the PR gate.
  insights:
    needs: [changes, ci]
    if: needs.changes.outputs.lean == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true

      - name: Restore project build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Set up Lean and dependency cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto

      - name: Audit potentially unused theorem hypotheses
        run: lake env lean scripts/CheckUnusedHypotheses.lean

      - name: Add unused hypothesis audit summary
        if: always()
        shell: bash
        run: |
          if [ -f unused-hypotheses.md ]; then
            cat unused-hypotheses.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate theorem catalog
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/TheoremCatalog.lean 2>&1 | tee theorem-catalog.log

      - name: Audit proof-guided theorem replacements
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/TheoremReplacementAudit.lean 2>&1 | tee theorem-replacement-audit.log

      - name: Merge theorem replacement findings
        run: python3 scripts/merge_theorem_replacements.py

      - name: Add theorem catalog summary
        if: success()
        shell: bash
        run: |
          echo "## Theorem catalog" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(Theorems|Retained audit declarations|Priority terminal review queue with no compiled project consumers|Single-consumer theorem review queue|Direct-wrapper review queue|Cross-module direct-wrapper review queue|Definitionally equivalent proof-dependency targets|Replacement-candidate targets):' docs/generated/theorems.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The complete Markdown and JSON catalogs are attached as a workflow artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload theorem catalog
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: theorem-catalog
          path: |
            docs/generated/theorems.md
            docs/generated/theorems.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload theorem catalog logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theorem-catalog-log
          path: |
            theorem-catalog.log
            theorem-replacement-audit.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish declaration graph data
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          graph_data_dir="$(mktemp -d)"
          git fetch origin graph-data
          git worktree add "$graph_data_dir" origin/graph-data
          cp docs/generated/theorems.json "$graph_data_dir/theorems.json"

          git -C "$graph_data_dir" config user.name "github-actions[bot]"
          git -C "$graph_data_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$graph_data_dir" add theorems.json

          if git -C "$graph_data_dir" diff --cached --quiet; then
            echo "Declaration graph data is unchanged."
            exit 0
          fi

          git -C "$graph_data_dir" commit -m "chore(graph-data): update theorem catalog"
          git -C "$graph_data_dir" push origin HEAD:graph-data
