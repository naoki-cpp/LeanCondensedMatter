name: Proof Regions Ranking Validation

on:
  push:
    branches: [feat/proof-region-ranking]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore project build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            project-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Set up Lean and dependency cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto

      - name: Validate proof-region ranking and transitions
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --run scripts/ProofRegions.lean LeanCondensedMatter/Permutation/TraceLog.lean
          lake env lean --run scripts/ProofRegions.lean LeanCondensedMatter/Analysis/Dyson/Basic.lean
          lake env lean --run scripts/ProofRegions.lean LeanCondensedMatter/Analysis/Operator/ZetaCommutator.lean
          cat > scripts/ProofRegionsTransitionProbe.lean <<'EOF'
          import Mathlib.Tactic

          example (a b c d : ℤ) (h : a + (b + c) = d) : (a + b) + c = d := by
            rw [add_assoc]
            change a + (b + c) = d
            exact h
          EOF
          lake env lean --run scripts/ProofRegions.lean scripts/ProofRegionsTransitionProbe.lean
          rm scripts/ProofRegionsTransitionProbe.lean
