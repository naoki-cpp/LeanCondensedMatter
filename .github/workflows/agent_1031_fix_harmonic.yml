name: Agent 1031 Harmonic Fix

on:
  push:
    branches:
      - agent/1031-fermionic-lattice

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Make harmonic response dependencies explicit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('LeanCondensedMatter/SecondQuantization/Fermionic/Field/HarmonicSourceResponse.lean')
          text = p.read_text(encoding='utf-8')
          needle = 'import LeanCondensedMatter.SecondQuantization.Fermionic.Field.FrequencyResponse\n'
          extra = 'import LeanCondensedMatter.SecondQuantization.Fermionic.Field.GeometricCurrentResponse\n'
          if extra not in text:
              text = text.replace(needle, needle + extra)
          ns = 'namespace Field\n\n'
          if 'namespace Field\n\nopen Lattice\n' not in text:
              text = text.replace(ns, 'namespace Field\n\nopen Lattice\n\n', 1)
          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/agent_1031_fix_harmonic.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(fermionic): make harmonic response lattice dependency explicit"
          git push
