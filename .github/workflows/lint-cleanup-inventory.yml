name: Lint cleanup inventory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: List targeted lint suppressions
        run: |
          echo '=== nolint declarations ==='
          grep -RIn -B 3 -A 8 -E '@\[[^]]*nolint|@\[nolint' LeanCondensedMatter || true
          echo '=== global and module linter options ==='
          grep -RIn -E 'linter\.(style\.)?(header|longLine|unnecessarySimpa)|set_option linter' lakefile.toml LeanCondensedMatter || true
          echo '=== focused simp dependencies ==='
          grep -RIn -B 2 -A 4 -E 'pairEndpoint_eq_pairEndpointAt|componentPairEquiv_apply|freeGibbsDensityOperator_apply_basis|deletedPositionsOrderIso_mem' LeanCondensedMatter || true
      - name: Package source tree
        run: |
          tar -czf lint-cleanup-source.tar.gz \
            LeanCondensedMatter lakefile.toml lake-manifest.json lean-toolchain scripts notes
      - uses: actions/upload-artifact@v4
        with:
          name: lint-cleanup-source
          path: lint-cleanup-source.tar.gz
          retention-days: 1
