name: Agent 1031 Qualify Lattice

on:
  push:
    branches:
      - agent/1031-fermionic-lattice

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Open lattice namespace in downstream consumers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('LeanCondensedMatter/SecondQuantization/Fermionic/Field')
          markers = (
              'FiniteLatticeHilbertFock',
              'LatticeGeometry',
              'LocallyFiniteHopping',
              'boundedDirectional',
              'boundedBondCurrent',
              'boundedBondContact',
              'latticeOccupationEquiv',
              'boundedLatticeOperator',
          )
          changed = []
          for p in root.rglob('*.lean'):
              text = p.read_text(encoding='utf-8')
              if not any(marker in text for marker in markers):
                  continue
              if 'namespace Field\n' not in text or 'open Lattice' in text:
                  continue
              text = text.replace('namespace Field\n', 'namespace Field\n\nopen Lattice\n', 1)
              p.write_text(text, encoding='utf-8')
              changed.append(str(p))
          print('qualified', len(changed), 'files')
          for path in changed:
              print(path)
          Path('.github/workflows/agent_1031_qualify_lattice.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(fermionic): qualify lattice-owned downstream API"
          git push
