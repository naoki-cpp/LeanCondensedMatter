name: Canonicalize Combinatorics API

on:
  push:
    branches:
      - agent/reorganize-combinatorics
    paths:
      - scripts/canonicalize_combinatorics_api.py
      - .github/workflows/canonicalize-combinatorics-api.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/reorganize-combinatorics
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Canonicalize API and module paths
        run: python scripts/canonicalize_combinatorics_api.py
      - name: Validate full library
        run: lake build LeanCondensedMatter
      - name: Remove one-shot migration files
        run: |
          rm scripts/canonicalize_combinatorics_api.py
          rm .github/workflows/canonicalize-combinatorics-api.yml
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor!: canonicalize shuffle and perfect-pairing APIs"
          git push origin HEAD:agent/reorganize-combinatorics
