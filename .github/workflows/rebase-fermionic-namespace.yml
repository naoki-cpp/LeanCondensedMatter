name: Rebase Fermionic Namespace Migration

on:
  pull_request:
    paths:
      - .github/workflows/rebase-fermionic-namespace.yml

permissions:
  contents: write

jobs:
  rebase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/canonicalize-fermionic-namespace
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Apply the validated R3 net diff
        run: |
          git fetch origin 8f62d165d774e82f50fcaf647b7f044927850d2a b850c0275d5a2d8bcf7d50c231350edbc4a7abbf
          git diff --binary 8f62d165d774e82f50fcaf647b7f044927850d2a b850c0275d5a2d8bcf7d50c231350edbc4a7abbf -- . > /tmp/fermionic-r3.patch
          test -s /tmp/fermionic-r3.patch
          git apply --index --3way /tmp/fermionic-r3.patch
      - name: Check canonical architecture
        run: python3 scripts/check_second_quantization_architecture.py
      - name: Validate full library
        run: lake build --wfail
      - name: Check for sorry
        run: |
          if grep -rnE '\bsorry\b' --include='*.lean' LeanCondensedMatter; then
            exit 1
          fi
      - name: Remove one-shot rebase workflow
        run: rm .github/workflows/rebase-fermionic-namespace.yml
      - name: Commit rebased namespace migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor!: move fermionic declarations into canonical namespace"
          git push origin HEAD:agent/canonicalize-fermionic-namespace
