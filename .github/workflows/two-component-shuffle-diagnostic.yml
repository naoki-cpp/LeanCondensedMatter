name: Two Component Shuffle Diagnostic

on:
  push:
    branches:
      - agent/two-component-shuffle-transport
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - name: Build target and capture output
        shell: bash
        run: |
          set +e
          lake build +LeanCondensedMatter.SecondQuantization.Common.Diagrammatics.TwoComponentOrderedSimplex \
            > two-component-shuffle-diagnostic.log 2>&1
          status=$?
          echo "exit_status=$status" >> two-component-shuffle-diagnostic.log
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: two-component-shuffle-diagnostic
          path: two-component-shuffle-diagnostic.log
          if-no-files-found: error
          retention-days: 1
