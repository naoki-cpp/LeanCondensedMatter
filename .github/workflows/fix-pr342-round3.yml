name: Fix PR 342 imports round 3

on:
  push:
    branches:
      - agent/reorganize-combinatorics

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/reorganize-combinatorics
          fetch-depth: 0

      - name: Apply import and analysis-layer fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("LeanCondensedMatter")

          bad_import = "LeanCondensedMatter.SecondQuantization.Common.Thermal.Combinatorics.PairingWeight"
          good_import = "LeanCondensedMatter.SecondQuantization.Common.Thermal.BlochDeDominicis.PairingWeight"
          changed = []
          for path in root.rglob("*.lean"):
              text = path.read_text()
              new_text = text.replace(bad_import, good_import)
              if new_text != text:
                  path.write_text(new_text)
                  changed.append(str(path))

          four_point = root / "SecondQuantization/Common/Thermal/BlochDeDominicis/Unnormalized/FourPointReduction.lean"
          text = four_point.read_text()
          marker = "\nopen Combinatorics\n"
          if marker not in text:
              raise SystemExit(f"expected open statement not found in {four_point}")
          four_point.write_text(text.replace(marker, "\n", 1))

          finite_component = root / "SecondQuantization/Common/Diagrammatics/FiniteComponentOrderedSimplex.lean"
          text = finite_component.read_text()
          old = "import LeanCondensedMatter.Combinatorics.FamilySlotShuffle\n"
          new = "import LeanCondensedMatter.Analysis.OrderedSimplex.FamilyShuffleIntegrand\n"
          if old not in text:
              raise SystemExit(f"expected import not found in {finite_component}")
          finite_component.write_text(text.replace(old, new, 1))

          print("Restored PairingWeight imports in:")
          print("\n".join(changed) if changed else "(none)")
          PY

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LeanCondensedMatter
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore physics imports and shuffle integrands"
            git push origin HEAD:agent/reorganize-combinatorics
          fi
