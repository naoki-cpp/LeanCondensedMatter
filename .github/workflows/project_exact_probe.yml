name: Project Reuse Probe

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: project-reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: proof-reuse-catalog-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            project-build-${{ runner.os }}-${{ runner.arch }}-
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto
      - name: Build project root
        run: lake build LeanCondensedMatter
      - name: Generate theorem catalog
        run: lake env lean scripts/TheoremCatalog.lean
      - name: Show direct wrappers
        run: |
          python3 - <<'PY'
          import json
          entries = json.load(open('docs/generated/theorems.json'))
          wrappers = [e for e in entries if e['directWrapperOf'] is not None]
          print('direct wrappers:', len(wrappers))
          for e in wrappers[:80]:
              print(f"{e['name']} -> {e['directWrapperOf']} | {e['module']}")
          PY
