name: Project Reuse Probe

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: project-reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: proof-reuse-prototype-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            project-build-${{ runner.os }}-${{ runner.arch }}-
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto
      - name: Build representative module
        run: lake build LeanCondensedMatter.SecondQuantization.Bosonic.Algebra.CreationAnnihilation
      - name: Compile project theorem index prototype
        run: |
          lake env lean scripts/ProofReusePrototype.lean 2>&1 | tee proof-reuse.log
          grep -q 'SecondQuantization.Bosonic.create_basisState (apply)' proof-reuse.log
          grep -q 'SecondQuantization.Bosonic.create_basisState_eq: no project theorem reuse found' proof-reuse.log
          grep -q 'SecondQuantization.Bosonic.create_basisState: no project theorem reuse found' proof-reuse.log
