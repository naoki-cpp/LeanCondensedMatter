name: Project Reuse Probe

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: project-reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: forwarding-reuse-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            project-build-${{ runner.os }}-${{ runner.arch }}-
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto
      - name: Build target modules
        run: |
          lake build LeanCondensedMatter.SecondQuantization.Bosonic.Algebra.NumberOperator
          lake build LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.NumberOperator
      - name: Verify forwarding compression
        shell: bash
        run: |
          cat > ForwardingProbe.py <<'PY'
          import re
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import proof_reuse_audit as audit

          HAVE_RE = re.compile(r"^\s*have\s+(?P<name>[A-Za-z_][A-Za-z0-9_']*)\s*:=\s*(?P<term>.*)$", re.S)
          RWA_RE = re.compile(r"^\s*rwa\s*\[(?P<rules>.*)\]\s+at\s+(?P<name>[A-Za-z_][A-Za-z0-9_']*)\s*$", re.S)
          def compact(text): return ' '.join(line.strip() for line in text.splitlines()).strip()

          def run(path):
              source = path.read_text(encoding='utf-8')
              lines = source.splitlines(keepends=True)
              generated = verified = 0
              for block in audit.find_proof_blocks(source, 2):
                  chunks = audit.top_level_tactic_chunks(source, block)
                  for first, second in zip(chunks, chunks[1:]):
                      have = HAVE_RE.match(''.join(lines[first.start_index:first.end_index]))
                      rwa = RWA_RE.match(''.join(lines[second.start_index:second.end_index]))
                      if have is None or rwa is None or have.group('name') != rwa.group('name'):
                          continue
                      term, rules = compact(have.group('term')), compact(rwa.group('rules'))
                      candidate = f"simpa [{rules}, exchangeAlgebra, numberOperator] using ({term})"
                      generated += 1
                      region = audit.Region(scope='interval', block_kind=block.kind,
                          start_line=first.start_line, end_line=second.end_line,
                          start_index=first.start_index, end_index=second.end_index,
                          indent=first.indent,
                          original_lines=first.significant_lines + second.significant_lines,
                          tactic_count=2)
                      code, output, timed_out = audit.run_probe(
                          audit.replace_region(source, region, candidate),
                          f"forward-{first.start_line}-{second.end_line}", 30)
                      print('CANDIDATE', path, first.start_line, second.end_line, candidate)
                      if code == 0 and not timed_out and audit.replay_is_admission_free(output):
                          verified += 1
                          print('VERIFIED', candidate)
                      else:
                          print('ERROR', audit.first_error(output))
              return generated, verified

          totals = [0,0]
          for raw in [
              'LeanCondensedMatter/SecondQuantization/Bosonic/Algebra/NumberOperator.lean',
              'LeanCondensedMatter/SecondQuantization/Fermionic/Algebra/NumberOperator.lean']:
              g,v = run(Path(raw).resolve()); totals[0] += g; totals[1] += v
          print('TOTAL_GENERATED', totals[0])
          print('TOTAL_VERIFIED', totals[1])
          if totals[1] != 2:
              raise SystemExit(f'expected two verified forwarding compressions, got {totals[1]}')
          PY
          python3 ForwardingProbe.py
