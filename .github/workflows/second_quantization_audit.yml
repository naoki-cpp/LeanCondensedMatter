name: SecondQuantization Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check architecture and final removals
        run: |
          python3 scripts/check_quantum_theory_architecture.py
          python3 scripts/check_second_quantization_audit_removals.py
