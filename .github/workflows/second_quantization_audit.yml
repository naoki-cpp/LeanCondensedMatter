name: SecondQuantization Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Check SecondQuantization architecture
        run: python3 scripts/check_second_quantization_architecture.py

      - name: Check fermionic algebraic Fock boundary
        run: python3 scripts/check_fermionic_algebraic_fock_boundary.py

      - name: Check single-particle dependency boundary
        run: python3 scripts/check_single_particle_architecture.py

      - name: Check dimension-independent mode boundary
        run: python3 scripts/check_second_quantization_mode_boundary.py

      - name: Check density dependency boundary
        run: python3 scripts/check_second_quantization_density_boundary.py

      - name: Check Bloch-de Dominicis boundary
        run: python3 scripts/check_bloch_de_dominicis_expectation_boundary.py
