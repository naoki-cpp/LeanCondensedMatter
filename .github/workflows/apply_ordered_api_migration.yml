name: Apply ordered API migration

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/remove-fermionic-ordered-forwarding' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply canonical ordered API migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          ROOT = Path.cwd()
          SQ = ROOT / "LeanCondensedMatter" / "SecondQuantization"
          WICK = SQ / "Fermionic" / "Diagrammatics" / "WickDiagram"

          def read(path: Path) -> str:
              return path.read_text(encoding="utf-8")

          def write(path: Path, text: str) -> None:
              path.write_text(text, encoding="utf-8")

          def replace_identifier(text: str, old: str, new: str) -> str:
              pattern = rf"(?<![A-Za-z0-9_.]){re.escape(old)}(?![A-Za-z0-9_])"
              return re.sub(pattern, new, text)

          amplitude = WICK / "Amplitude.lean"
          text = read(amplitude)
          text = text.replace(
              "import LeanCondensedMatter.SecondQuantization.Fermionic.Diagrammatics.WickDiagram.Ordered\n",
              "import LeanCondensedMatter.SecondQuantization.Common.Diagrammatics.Ordered\n"
              "import LeanCondensedMatter.SecondQuantization.Fermionic.Diagrammatics.WickDiagram\n",
              1,
          )
          text = text.replace("`WickDiagram/Ordered.lean`", "`Common/Diagrammatics/Ordered.lean`")
          text = text.replace(
              "instance QuarticVertexOrder.uniqueEmpty : Unique (QuarticVertexOrder",
              "instance quarticVertexOrderUniqueEmpty : Unique (Common.QuarticVertexOrder",
          )
          text = replace_identifier(text, "QuarticVertexOrder", "Common.QuarticVertexOrder")
          write(amplitude, text)

          amplitude_factorization = WICK / "AmplitudeFactorization.lean"
          text = read(amplitude_factorization)
          ordered_import = "import LeanCondensedMatter.SecondQuantization.Common.Diagrammatics.Ordered\n"
          if ordered_import not in text:
              text = ordered_import + text
          text = replace_identifier(text, "QuarticVertexOrder", "Common.QuarticVertexOrder")
          write(amplitude_factorization, text)

          component_pairing = WICK / "ComponentPairing.lean"
          text = read(component_pairing)
          if ordered_import not in text:
              text = ordered_import + text
          text = replace_identifier(text, "QuarticVertexOrder", "Common.QuarticVertexOrder")
          text = replace_identifier(text, "orderedLegToDiagramLeg", "Common.orderedLegToDiagramLeg")
          write(component_pairing, text)

          dyson = SQ / "Fermionic" / "Diagrammatics" / "DysonDiagramExpansion.lean"
          text = read(dyson)
          if ordered_import not in text:
              anchor = "import LeanCondensedMatter.SecondQuantization.Common.Perturbation.DysonExpansion\n"
              text = text.replace(anchor, anchor + ordered_import, 1)
          text = replace_identifier(text, "QuarticVertexOrder", "Common.QuarticVertexOrder")
          text = replace_identifier(text, "orderedLegToDiagramLeg", "Common.orderedLegToDiagramLeg")
          text = replace_identifier(text, "someVertexOrder", "Common.someVertexOrder")
          text = replace_identifier(text, "card_quarticVertexOrder", "Common.card_quarticVertexOrder")
          text = text.replace(
              "OrderedQuarticWickData Mode",
              "Common.OrderedQuarticDiagramData (QuarticVertexLabel Mode)",
          )
          text = replace_identifier(
              text,
              "OrderedQuarticWickData",
              "Common.OrderedQuarticDiagramData",
          )
          text = replace_identifier(
              text,
              "quarticWickDiagramEquivOrderedData",
              "Common.quarticDiagramEquivOrderedData",
          )
          text = replace_identifier(
              text,
              "sum_quarticWickDiagram_eq_sum_orderedData",
              "Common.sum_quarticDiagram_eq_sum_orderedData",
          )
          write(dyson, text)

          ordered = WICK / "Ordered.lean"
          ordered.unlink()

          guard = ROOT / "scripts" / "check_second_quantization_architecture.py"
          text = read(guard)
          removed_file = (
              '    SQ / "Fermionic" / "Diagrammatics" / "WickDiagram" / "Ordered.lean",\n'
          )
          if removed_file not in text:
              start = text.index("REMOVED_FILES = (\n")
              end = text.index("\n)\n\nREMOVED_DIRECTORIES", start)
              text = text[:end] + "\n" + removed_file.rstrip("\n") + text[end:]
          removed_import_key = (
              '    "import LeanCondensedMatter.SecondQuantization.Fermionic.Diagrammatics.'
              'WickDiagram.Ordered":\n'
              '        "removed fermionic Ordered import",\n'
          )
          if "removed fermionic Ordered import" not in text:
              start = text.index("REMOVED_IMPORTS = {\n")
              end = text.index("\n}\n\nALLOWED_EXTERNAL_DECLARATIONS", start)
              text = text[:end] + "\n" + removed_import_key.rstrip("\n") + text[end:]
          write(guard, text)

          identifier_guard = ROOT / "scripts" / "check_second_quantization_removed_identifiers.py"
          text = read(identifier_guard)
          new_entries = (
              '    "OrderedQuarticWickData": "removed Fermionic ordered-data alias",\n'
              '    "quarticWickDiagramEquivOrderedData": '
              '"removed Fermionic ordered-data equivalence alias",\n'
              '    "sum_quarticWickDiagram_eq_sum_orderedData": '
              '"removed Fermionic ordered-data sum theorem",\n'
          )
          if "removed Fermionic ordered-data alias" not in text:
              start = text.index("REMOVED_IDENTIFIERS = {\n")
              end = text.index("\n}\n\n\ndef relative", start)
              text = text[:end] + "\n" + new_entries.rstrip("\n") + text[end:]
          write(identifier_guard, text)

          forbidden = [
              "import LeanCondensedMatter.SecondQuantization.Fermionic.Diagrammatics.WickDiagram.Ordered",
              "OrderedQuarticWickData",
              "quarticWickDiagramEquivOrderedData",
              "sum_quarticWickDiagram_eq_sum_orderedData",
          ]
          errors: list[str] = []
          for path in sorted((ROOT / "LeanCondensedMatter").rglob("*.lean")):
              source = read(path)
              for token in forbidden:
                  if token in source:
                      errors.append(f"{path.relative_to(ROOT)} still contains {token}")
          if errors:
              raise SystemExit("\n".join(errors))
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Migration already applied"
            exit 0
          fi
          git commit -m "refactor: migrate fermionic ordered API"
          git push origin HEAD:${GITHUB_HEAD_REF}
