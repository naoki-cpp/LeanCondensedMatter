name: Agent fold ComponentLegInversion

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/fold-component-leg-inversion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fold-component-leg-inversion
          fetch-depth: 0
      - name: Fold ComponentLegInversion into pair crossing parity
        shell: python
        run: |
          from pathlib import Path

          root = Path.cwd()
          wick = root / "LeanCondensedMatter/SecondQuantization/Fermionic/Diagrammatics/WickDiagram"
          source = wick / "ComponentLegInversion.lean"
          target = wick / "ComponentPairCrossingParity.lean"
          umbrella = root / "LeanCondensedMatter/SecondQuantization/Fermionic/Diagrammatics.lean"
          guard = root / "scripts/check_second_quantization_architecture.py"
          workflow = root / ".github/workflows/agent-fold-component-leg-inversion.yml"

          source_text = source.read_text(encoding="utf-8")
          target_text = target.read_text(encoding="utf-8")

          source_marker = "variable {Mode : Type*} {N : ℕ}\n\n"
          source_end = "\nend Fermionic\nend SecondQuantization\n"
          if source_marker not in source_text or source_end not in source_text:
              raise RuntimeError("unexpected ComponentLegInversion structure")
          moved = source_text.split(source_marker, 1)[1].rsplit(source_end, 1)[0].rstrip() + "\n\n"

          removed_import = (
              "import LeanCondensedMatter.SecondQuantization.Fermionic.Diagrammatics."
              "WickDiagram.ComponentLegInversion\n"
          )
          if target_text.count(removed_import) != 1:
              raise RuntimeError("unexpected target import count")
          target_text = target_text.replace(removed_import, "", 1)

          target_marker = "variable {Mode : Type*} {N : ℕ}\n\n"
          if target_text.count(target_marker) != 1:
              raise RuntimeError("unexpected target declaration marker count")
          target_text = target_text.replace(target_marker, target_marker + moved, 1)
          target.write_text(target_text, encoding="utf-8")

          umbrella_text = umbrella.read_text(encoding="utf-8")
          if umbrella_text.count(removed_import) != 1:
              raise RuntimeError("unexpected umbrella import count")
          umbrella.write_text(umbrella_text.replace(removed_import, "", 1), encoding="utf-8")

          guard_text = guard.read_text(encoding="utf-8")
          previous_removed = (
              '    SQ / "Fermionic" / "Diagrammatics" / "WickDiagram" / '
              '"ComponentCrossingParity.lean",\n'
          )
          new_removed = (
              '    SQ / "Fermionic" / "Diagrammatics" / "WickDiagram" / '
              '"ComponentLegInversion.lean",\n'
          )
          if new_removed not in guard_text:
              if guard_text.count(previous_removed) != 1:
                  raise RuntimeError("unexpected removed-file anchor count")
              guard_text = guard_text.replace(previous_removed, previous_removed + new_removed, 1)

          previous_check = '''            if line.strip() == "import LeanCondensedMatter.SecondQuantization.Fermionic.Diagrammatics.WickDiagram.ComponentCrossingParity":
                errors.append(
                    f"removed fermionic ComponentCrossingParity import: {relative(path)}:{line_no}: {line.strip()}"
                )
'''
          new_check = '''            if line.strip() == "import LeanCondensedMatter.SecondQuantization.Fermionic.Diagrammatics.WickDiagram.ComponentLegInversion":
                errors.append(
                    f"removed fermionic ComponentLegInversion import: {relative(path)}:{line_no}: {line.strip()}"
                )
'''
          if new_check not in guard_text:
              if guard_text.count(previous_check) != 1:
                  raise RuntimeError("unexpected removed-import anchor count")
              guard_text = guard_text.replace(previous_check, previous_check + new_check, 1)
          guard.write_text(guard_text, encoding="utf-8")

          source.unlink()
          workflow.unlink()
      - name: Check SecondQuantization architecture
        run: python scripts/check_second_quantization_architecture.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: fold ComponentLegInversion into pair crossing parity"
          git push origin HEAD:agent/fold-component-leg-inversion
