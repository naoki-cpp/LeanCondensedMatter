name: Agent 1031 Common Kernel Fix

on:
  push:
    branches:
      - agent/1031-fermionic-lattice

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Qualify lattice owner in StredaCommonKernel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('LeanCondensedMatter/SecondQuantization/Fermionic/Transport/StredaCommonKernel.lean')
          text = p.read_text(encoding='utf-8')
          needle = 'namespace SecondQuantization.Fermionic.Transport\n\n'
          addition = 'open SecondQuantization.Fermionic.Lattice\n'
          if addition not in text:
              text = text.replace(needle, needle + addition, 1)
          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/agent_1031_fix_common_kernel.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(fermionic-transport): qualify lattice API in common kernel"
          git push
