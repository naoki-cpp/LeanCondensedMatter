name: Binary Shuffle Contribution Diagnostic

on:
  push:
    branches:
      - agent/binary-shuffle-contributions
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - name: Build target and capture output
        shell: bash
        run: |
          set +e
          lake build +LeanCondensedMatter.Analysis.BinaryShuffleOrderedSimplex \
            > binary-shuffle-contribution-diagnostic.log 2>&1
          status=$?
          echo "exit_status=$status" >> binary-shuffle-contribution-diagnostic.log
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: binary-shuffle-contribution-diagnostic
          path: binary-shuffle-contribution-diagnostic.log
          if-no-files-found: error
          retention-days: 1
