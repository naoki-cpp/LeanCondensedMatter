name: Agent 1032 Sync Main

on:
  push:
    branches:
      - agent/1032-fermionic-transport-validation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/1032-fermionic-transport-validation
          fetch-depth: 0
      - name: Merge latest main and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git rm -f .github/workflows/agent_1032_sync_main.yml
          git commit -m 'chore: remove #1032 main-sync workflow'
          git push origin HEAD:agent/1032-fermionic-transport-validation
