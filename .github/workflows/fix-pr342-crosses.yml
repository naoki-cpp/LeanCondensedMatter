name: Fix PR 342 crossing namespace

on:
  push:
    branches:
      - agent/reorganize-combinatorics

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/reorganize-combinatorics
          fetch-depth: 0

      - name: Migrate crossing relation namespace
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("LeanCondensedMatter")
          replacements = [
              ("Common.BlochDeDominicis.crosses_map_iff", "Combinatorics.crosses_map_iff"),
              ("Common.BlochDeDominicis.Crosses", "Combinatorics.Crosses"),
          ]

          changed = []
          for path in root.rglob("*.lean"):
              text = path.read_text()
              new_text = text
              for old, new in replacements:
                  new_text = new_text.replace(old, new)
              if new_text != text:
                  path.write_text(new_text)
                  changed.append(str(path))

          if not changed:
              raise SystemExit("no legacy crossing namespace references found")

          print("Updated crossing namespace references in:")
          print("\n".join(changed))
          PY

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LeanCondensedMatter
          git commit -m "fix: complete crossing namespace migration"
          git push origin HEAD:agent/reorganize-combinatorics
