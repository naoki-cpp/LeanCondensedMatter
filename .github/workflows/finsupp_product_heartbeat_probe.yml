name: FinsuppProduct heartbeat probe

on:
  pull_request:
    paths:
      - ".github/workflows/finsupp_product_heartbeat_probe.yml"
      - ".github/probes/FinsuppProduct.lean"
      - "LeanCondensedMatter/Analysis/InfiniteSum/FinsuppProduct.lean"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-with-default-heartbeats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the candidate proof in the runner workspace
        run: |
          cp .github/probes/FinsuppProduct.lean \
            LeanCondensedMatter/Analysis/InfiniteSum/FinsuppProduct.lean
          python3 - <<'PY'
          from pathlib import Path

          path = Path("LeanCondensedMatter/Analysis/InfiniteSum/FinsuppProduct.lean")
          text = path.read_text(encoding="utf-8")
          text = text.replace("some i", "Option.some i")
          path.write_text(text, encoding="utf-8")
          PY
          if grep -n "set_option maxHeartbeats 0" \
              LeanCondensedMatter/Analysis/InfiniteSum/FinsuppProduct.lean; then
            echo "::error::candidate still contains an unbounded heartbeat override"
            exit 1
          fi

      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "--wfail"
