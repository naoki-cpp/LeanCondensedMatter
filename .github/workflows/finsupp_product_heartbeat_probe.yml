name: Promote FinsuppProduct heartbeat refactor

on:
  pull_request:
    paths:
      - ".github/workflows/finsupp_product_heartbeat_probe.yml"
      - ".github/probes/FinsuppProduct.lean"
      - "LeanCondensedMatter/Analysis/InfiniteSum/FinsuppProduct.lean"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/remove-finsupp-product-heartbeats

      - name: Install the validated proof
        run: |
          cp .github/probes/FinsuppProduct.lean \
            LeanCondensedMatter/Analysis/InfiniteSum/FinsuppProduct.lean
          python3 - <<'PY'
          from pathlib import Path

          path = Path("LeanCondensedMatter/Analysis/InfiniteSum/FinsuppProduct.lean")
          text = path.read_text(encoding="utf-8")

          marker = "private theorem hasSum_prod_fin_zero\n"
          helper = (
              "private theorem summable_mul_explicit\n"
              "    {α β R : Type*} [NormedCommRing R] [CompleteSpace R]\n"
              "    (u : α → R) (v : β → R)\n"
              "    (hu : Summable (fun i => ‖u i‖))\n"
              "    (hv : Summable (fun j => ‖v j‖)) :\n"
              "    Summable (fun p : α × β => u p.1 * v p.2) :=\n"
              "  (hu.mul_norm hv).of_norm\n\n"
          )
          if marker not in text:
              raise SystemExit("helper insertion marker not found")
          text = text.replace(marker, helper + marker, 1)

          old_option = (
              "  apply hasSum_prod_option_reindex (finSuccFamily f) (finSuccFamily a)\n"
              "  exact hasSum_mul_of_summable_norm' hhead htail habsHead habsTail\n"
          )
          new_option = (
              "  let tail : (Fin k →₀ ℕ) → R :=\n"
              "    fun n => ∏ i : Fin k, f i.succ (n i)\n"
              "  have hmul : Summable\n"
              "      (fun p : ℕ × (Fin k →₀ ℕ) => f 0 p.1 * tail p.2) :=\n"
              "    summable_mul_explicit (f 0) tail habsHead habsTail\n"
              "  have htail' : HasSum tail (∏ i : Fin k, a i.succ) := htail\n"
              "  have hprod : HasSum\n"
              "      (fun p : ℕ × (Fin k →₀ ℕ) => f 0 p.1 * tail p.2)\n"
              "      (a 0 * ∏ i : Fin k, a i.succ) :=\n"
              "    hhead.mul htail' hmul\n"
              "  exact hasSum_prod_option_reindex (finSuccFamily f) (finSuccFamily a) hprod\n"
          )
          if old_option not in text:
              raise SystemExit("option successor block not found")
          text = text.replace(old_option, new_option, 1)

          old_general = (
              "  apply hasSum_prod_fin_succ f a (hf 0) htail (habs 0)\n"
              "  exact summable_norm_prod (fun i => f i.succ) (fun i => habs i.succ)\n"
          )
          new_general = (
              "  have habsTail : Summable\n"
              "      (fun n : Fin k →₀ ℕ => ‖∏ i : Fin k, f i.succ (n i)‖) :=\n"
              "    summable_norm_prod (fun i : Fin k => f i.succ) (fun i => habs i.succ)\n"
              "  exact hasSum_prod_fin_succ f a (hf 0) htail (habs 0) habsTail\n"
          )
          if old_general not in text:
              raise SystemExit("general successor block not found")
          text = text.replace(old_general, new_general, 1)

          path.write_text(text, encoding="utf-8")
          PY
          if grep -n "set_option maxHeartbeats 0" \
              LeanCondensedMatter/Analysis/InfiniteSum/FinsuppProduct.lean; then
            echo "::error::unbounded heartbeat override remains"
            exit 1
          fi

      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "--wfail"

      - name: Commit the validated source
        run: |
          git add LeanCondensedMatter/Analysis/InfiniteSum/FinsuppProduct.lean
          if git diff --cached --quiet; then
            echo "Validated source is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: remove unbounded FinsuppProduct heartbeats"
          git push origin HEAD:agent/remove-finsupp-product-heartbeats
