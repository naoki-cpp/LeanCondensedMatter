name: R5 fold component pairs

on:
  push:
    branches:
      - agent/fold-component-pairs

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fold ComponentPairs into ComponentPairing
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          wick = root / 'LeanCondensedMatter/SecondQuantization/Fermionic/Diagrammatics/WickDiagram'

          pairing_path = wick / 'ComponentPairing.lean'
          pairing = pairing_path.read_text(encoding='utf-8')
          marker = '\nend Fermionic\nend SecondQuantization\n'
          theorem = r'''
          /-- A component-local normalized pair maps to, and is reflected by, the corresponding normalized
          pair of the assembled global ordered pairing. -/
          theorem QuarticWickDiagram.mem_pairingInOrder_pairs_componentOrderedLeg_iff
              {S : Finset (Fin N)} (d : QuarticWickDiagram Mode N S)
              (orders : d.ComponentVertexOrders) (shuffle : d.ComponentShuffle)
              (B : d.componentPartition.parts)
              (a b : Fin (2 * (2 * (B : Finset (Fin N)).card))) :
              (d.componentOrderedLeg shuffle B a, d.componentOrderedLeg shuffle B b) ∈
                  (d.pairingInOrder (d.assembleVertexOrder orders shuffle)).pairs ↔
                (a, b) ∈ ((d.restrictComponent B.2).pairingInOrder (orders B)).pairs := by
            rw [Combinatorics.Pairing.mem_pairs_iff,
              Combinatorics.Pairing.mem_pairs_iff]
            let e := d.componentOrderedLegOrderEmbedding shuffle B
            constructor
            · rintro ⟨hab, hpartner⟩
              refine ⟨e.lt_iff_lt.mp hab, ?_⟩
              apply e.injective
              calc
                d.componentOrderedLeg shuffle B
                    (((d.restrictComponent B.2).pairingInOrder (orders B)).partner a) =
                  (d.pairingInOrder (d.assembleVertexOrder orders shuffle)).partner
                    (d.componentOrderedLeg shuffle B a) :=
                  (d.pairingInOrder_partner_componentOrderedLeg orders shuffle B a).symm
                _ = d.componentOrderedLeg shuffle B b := hpartner
            · rintro ⟨hab, hpartner⟩
              refine ⟨e.lt_iff_lt.mpr hab, ?_⟩
              rw [d.pairingInOrder_partner_componentOrderedLeg orders shuffle B, hpartner]
          '''
          assert pairing.count(marker) == 1
          pairing_path.write_text(pairing.replace(marker, '\n' + theorem + marker), encoding='utf-8')

          product_path = wick / 'ComponentPairProduct.lean'
          product = product_path.read_text(encoding='utf-8')
          old_import = 'import LeanCondensedMatter.SecondQuantization.Fermionic.Diagrammatics.WickDiagram.ComponentPairs\n'
          new_import = 'import LeanCondensedMatter.SecondQuantization.Fermionic.Diagrammatics.WickDiagram.ComponentPairing\n'
          assert product.count(old_import) == 1
          product_path.write_text(product.replace(old_import, new_import), encoding='utf-8')

          umbrella_path = root / 'LeanCondensedMatter/SecondQuantization/Fermionic/Diagrammatics.lean'
          umbrella = umbrella_path.read_text(encoding='utf-8')
          assert umbrella.count(old_import) == 1
          umbrella_path.write_text(umbrella.replace(old_import, ''), encoding='utf-8')

          guard_path = root / 'scripts/check_second_quantization_architecture.py'
          guard = guard_path.read_text(encoding='utf-8')
          removed_anchor = '    SQ / "Fermionic" / "Perturbation" / "ContinuousDyson.lean",\n'
          removed_line = (
              '    SQ / "Fermionic" / "Diagrammatics" / "WickDiagram" / '
              '"ComponentPairs.lean",\n'
          )
          assert guard.count(removed_anchor) == 1
          guard = guard.replace(removed_anchor, removed_anchor + removed_line)

          import_anchor = '''            if line.strip() == "import LeanCondensedMatter.SecondQuantization.Fermionic.Perturbation.ContinuousDyson":
                          errors.append(
                              f"removed fermionic continuous-Dyson import: {relative(path)}:{line_no}: {line.strip()}"
                          )
          '''
          import_check = '''            if line.strip() == "import LeanCondensedMatter.SecondQuantization.Fermionic.Diagrammatics.WickDiagram.ComponentPairs":
                          errors.append(
                              f"removed fermionic ComponentPairs import: {relative(path)}:{line_no}: {line.strip()}"
                          )
          '''
          assert guard.count(import_anchor) == 1
          guard_path.write_text(guard.replace(import_anchor, import_anchor + import_check), encoding='utf-8')

          pairs_path = wick / 'ComponentPairs.lean'
          assert pairs_path.is_file()
          pairs_path.unlink()
          PY

      - name: Check architecture
        run: python scripts/check_second_quantization_architecture.py

      - name: Remove one-shot workflow
        run: rm .github/workflows/r5-fold-component-pairs.yml

      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: fold component pairs into pairing module"
          git push
