name: Migrate Common Root Namespace

on:
  pull_request:
    paths:
      - scripts/migrate_common_root_namespace.py
      - scripts/audit_second_quantization_namespaces.py
      - scripts/check_second_quantization_architecture.py
      - .github/workflows/migrate-common-root-namespace.yml
      - LeanCondensedMatter/SecondQuantization/**
      - notes/roadmaps/second-quantization-refactor.md

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/audit-second-quantization-root-declarations
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Migrate Common declarations and callers
        run: python3 scripts/migrate_common_root_namespace.py
      - name: Check canonical architecture
        run: python3 scripts/check_second_quantization_architecture.py
      - name: Validate full library
        run: lake build --wfail
      - name: Check for sorry
        run: |
          if grep -rnE '\bsorry\b' --include='*.lean' LeanCondensedMatter; then
            exit 1
          fi
      - name: Remove one-shot migration files
        run: |
          rm scripts/migrate_common_root_namespace.py
          rm .github/workflows/migrate-common-root-namespace.yml
          rm .github/workflows/audit-second-quantization-namespaces.yml
      - name: Commit Common namespace migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor!: move Common declarations into canonical namespace"
          git push origin HEAD:agent/audit-second-quantization-root-declarations
