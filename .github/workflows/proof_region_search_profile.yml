name: Proof Region Search Profile

on:
  push:
    branches: [chore/proof-region-search-profile]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [NoAudit, NoExact, NoRewrite, NoTransitions, Full]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Lean
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto

      - name: Build target
        shell: bash
        run: |
          set -euo pipefail
          lake build LeanCondensedMatter.SecondQuantization.Fermionic.Algebra.CanonicalAnticommutationRelations \
            2>&1 | grep -vE '^(trace:|Some required targets logged failures:|- LeanCondensedMatter\.|error: build failed$)' || true

      - name: Prepare profile variant
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          variant = os.environ['VARIANT']
          source = Path('scripts/ProofRegions.lean').read_text()

          def replace_once(pattern, replacement, text):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'profile transform failed: {variant}')
              return updated

          if variant == 'Full':
              text = source
          elif variant == 'NoExact':
              text = replace_once(
                  r'^  if let some candidate ← exactSearch exactCache first goal region\.spanLines source then\n    best := betterCandidate best candidate\n',
                  '  pure ()\n', source)
          elif variant == 'NoRewrite':
              text = replace_once(
                  r'^  if let some candidate ← rewriteSearch rewriteCache first goal region\.spanLines source then\n    best := betterCandidate best candidate\n',
                  '  pure ()\n', source)
          elif variant == 'NoTransitions':
              text = replace_once(r'^      for start in \[:seq\.size\] do\n',
                                  '      for start in [:0] do\n', source)
          elif variant == 'NoAudit':
              text = replace_once(r'^  let results ← runAudit inputCtx state minLines\n',
                                  '  let results : Array AuditResult := #[]\n', source)
          else:
              raise SystemExit(f'unknown variant: {variant}')

          Path('scripts/ProofRegionsProfile.lean').write_text(text)
          PY

      - name: Profile CAR audit
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          file=LeanCondensedMatter/SecondQuantization/Fermionic/Algebra/CanonicalAnticommutationRelations.lean
          /usr/bin/time -f "${VARIANT}_SECONDS=%e" \
            timeout 600s lake env lean --run scripts/ProofRegionsProfile.lean "$file" 2 \
            > "/tmp/${VARIANT}.out"
          head -n 1 "/tmp/${VARIANT}.out"
