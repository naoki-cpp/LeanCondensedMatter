name: Agent 1029 Fix Export Guards

on:
  push:
    branches:
      - agent/1029-normalize-root-umbrellas

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/1029-normalize-root-umbrellas
          fetch-depth: 0
      - name: Move leaf-export guards to QuantumTheory umbrella
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("scripts/check_quantum_picture_equivalence.py"),
              Path("scripts/check_quantum_equations_of_motion.py"),
              Path("scripts/check_quantum_conservation_laws.py"),
          ]
          old = 'ROOT_UMBRELLA = ROOT / "LeanCondensedMatter.lean"'
          new = 'ROOT_UMBRELLA = ROOT / "LeanCondensedMatter" / "QuantumTheory.lean"'
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected old umbrella owner not found in {path}")
              text = text.replace(old, new, 1)
              text = text.replace(
                  "root import surface must expose",
                  "QuantumTheory public umbrella must expose",
              )
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/agent_1029_fix_export_guards.yml").unlink()
          PY
          git config user.name "naok1"
          git config user.email "puni87gou@gmail.com"
          git add scripts/check_quantum_picture_equivalence.py \
                  scripts/check_quantum_equations_of_motion.py \
                  scripts/check_quantum_conservation_laws.py \
                  .github/workflows/agent_1029_fix_export_guards.yml
          git commit -m "ci(api): move QuantumTheory export guards to track umbrella"
          git push origin HEAD:agent/1029-normalize-root-umbrellas
