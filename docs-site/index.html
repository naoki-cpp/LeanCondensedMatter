<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore theorem dependencies and Lean module imports in LeanCondensedMatter.">
  <meta name="theme-color" content="#f8f7f2">
  <title>LeanCondensedMatter Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="./site.css">
  <link rel="stylesheet" href="./module-overview.css">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"]],
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code", "annotation", "annotation-xml"],
      },
    };
  </script>
  <script defer data-math-renderer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
</head>
<body>
  <a class="skip-link" href="#explorer-content">Skip to explorer</a>
  <svg class="graph-definitions" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <marker id="dependency-arrow" viewBox="0 0 10 10" refX="19" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
        <path d="M 0 1 L 8 5 L 0 9 Z" fill="#627b6c" fill-opacity="0.8"></path>
      </marker>
      <marker id="dependency-arrow-muted" viewBox="0 0 10 10" refX="19" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
        <path d="M 0 1 L 8 5 L 0 9 Z" fill="#819287" fill-opacity="0.3"></path>
      </marker>
      <marker id="import-arrow" viewBox="0 0 10 10" refX="19" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
        <path d="M 0 1 L 8 5 L 0 9 Z" fill="context-stroke"></path>
      </marker>
    </defs>
  </svg>

  <header class="site-header">
    <a class="brand" href="./" aria-label="LeanCondensedMatter explorer home">
      <span>
        <h1 translate="no">LeanCondensedMatter</h1>
        <small>Formalizing condensed matter physics in Lean 4</small>
      </span>
    </a>
    <nav aria-label="Project links">
      <button id="overview-link" class="nav-button" type="button">Declarations</button>
      <button id="module-imports-link" class="nav-button" type="button">Imports</button>
      <a href="https://github.com/naoki-cpp/LeanCondensedMatter">GitHub</a>
      <a href="https://github.com/naoki-cpp/LeanCondensedMatter/blob/main/docs/roadmap.md">Roadmap</a>
    </nav>
  </header>

  <main class="app-shell">
    <aside class="controls" aria-label="Graph controls">
      <form id="search-form" class="search-form" role="search">
        <label for="theorem-search">Declaration</label>
        <div class="search-row">
          <input id="theorem-search" name="query" type="search" role="combobox" aria-autocomplete="list" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Try a declaration or module…" aria-controls="search-results" aria-expanded="false" aria-describedby="search-status">
          <button type="submit">Go</button>
        </div>
        <div id="search-results" class="search-results" role="listbox" aria-label="Search matches" hidden></div>
        <p id="search-status" class="control-help" role="status"></p>
      </form>

      <div class="control-grid" hidden>
        <label>
          Direction
          <select id="direction">
            <option value="both">Dependencies + consumers</option>
            <option value="dependencies">Dependencies (outgoing)</option>
            <option value="consumers">Consumers (incoming)</option>
          </select>
        </label>
        <label>
          Depth
          <select id="depth">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </label>
      </div>

      <label>
        Graph module filter
        <select id="module-filter" aria-describedby="module-filter-hint" disabled>
          <option value="*">All modules</option>
        </select>
        <span id="module-filter-hint" class="control-help">Available after opening a declaration.</span>
      </label>

      <label>Declaration kind
        <select id="kind-filter">
          <option value="*">All declarations</option>
          <option value="theorem">Theorems</option>
          <option value="definition">Definitions (def / abbrev / opaque)</option>
          <option value="axiom">Axioms</option>
          <option value="inductive">Inductive types / structures</option>
          <option value="constructor">Constructors</option>
          <option value="recursor">Recursors</option>
        </select>
      </label>
      <label class="checkbox-control"><input id="generated-filter" type="checkbox"> Include generated declarations</label>

      <fieldset class="highlight-controls" hidden>
        <legend>Highlight</legend>
        <label><input type="checkbox" data-highlight="terminal"> terminal</label>
        <label><input type="checkbox" data-highlight="zero"> zero consumer</label>
        <label><input type="checkbox" data-highlight="single"> single consumer</label>
        <label><input type="checkbox" data-highlight="wrapper"> direct wrapper</label>
      </fieldset>

      <div id="graph-legend-home">
        <div class="legend" aria-label="Graph legend" hidden></div>
      </div>

    </aside>

    <section id="explorer-content" class="graph-panel" tabindex="-1" aria-label="Declaration and module exploration panel">
      <div id="overview" class="overview-panel" aria-live="polite"></div>
      <header class="import-map-header" hidden>
        <h2 class="research-map-title"></h2>
        <div class="map-search-slot"></div>
      </header>
      <div class="graph-toolbar" hidden>
        <span id="graph-status" role="status">Loading theorem catalog…</span>
        <div class="graph-view-controls" role="group" aria-label="Graph view">
          <button id="graph-zoom-out" type="button" aria-label="Zoom out">−</button>
          <button id="graph-zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="graph-fit" type="button">Fit</button>
        </div>
      </div>

      <div id="graph-viewport" class="graph-scroll" tabindex="0" aria-label="Graph viewport. Use arrow keys to pan, plus or minus to zoom, and zero to fit." hidden>
        <div class="graph-directions" aria-hidden="true"><span id="graph-direction-left"></span><span id="graph-direction-right"></span></div>
        <svg id="graph" role="group" aria-label="Interactive theorem dependency graph"></svg>
      </div>
    </section>

    <aside id="detail" class="detail-panel" aria-live="polite"></aside>
  </main>

  <script type="module" src="./graph.js"></script>
  <script type="module" src="./pinch-zoom.js"></script>
</body>
</html>
